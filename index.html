<script>

const {createClient}=supabase;
let sb=null,user=null,warehouses=[],allInspections=[],defectCache=[],responsibles=[];
const BASE_AREAS=[['Roof','Leaks, surface damage, drainage'],['Walls & Facade','Cracks, damage, cladding'],['Floor','Potholes, cracks, surface damage'],['Gates & Doors','Operation, locks, hinges, sealing'],['Windows','Glass, frames, sealing'],['Electrical','Lights, panels, cables, sockets'],['Lighting','Internal and external lighting'],['Fire Safety','Fire extinguishers, exits, signs, access'],['Ventilation','Ventilation, grilles, equipment'],['Housekeeping & Order','Waste, access routes, storage'],['Surrounding Area','Roads, drainage, fencing, vegetation']];
function areasFor(id){return Number(id)<=8?[...BASE_AREAS,['Tent Condition','Tears, damage, tension, fixings, frame, leaks']]:BASE_AREAS}
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function safe(s){return String(s||'file').replace(/[^a-zA-Z0-9._-]/g,'_').slice(-90)}
function cls(s){return s==='Critical'?'critical':s==='Attention'?'attention':s==='OK'?'ok':s==='In Progress'?'inprogress':s==='Completed'?'completed':s==='Verified'?'verified':s==='OVERDUE'?'overdue':'none'}
function getOverallStatus(ins){const items=Array.isArray(ins?.inspection_items)?ins.inspection_items:[];if(items.some(x=>x?.status==='Critical'))return 'Critical';if(items.some(x=>x?.status==='Attention'))return 'Attention';return items.length?'OK':'Not Inspected'}
function isOverdue(d){return !!d && d<localDate()}
function toast(msg,type=''){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast ${type}">${esc(msg)}</div>`;setTimeout(()=>r.innerHTML='',3500)}
function showModal(title,html){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2 style="margin:0">${esc(title)}</h2><button class="secondary" onclick="closeModal()">Close</button></div>${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function nav(id){['nDash','nInspect','nDef','nWeekly','nReports','nAudit','nSet'].forEach(x=>{const el=document.getElementById(x);if(el)el.classList.remove('active')});const el=document.getElementById(id);if(el)el.classList.add('active')}
function normalizeSupabaseUrl(raw){try{let u=new URL(String(raw||'').trim());u.pathname='';u.search='';u.hash='';return u.toString().replace(/\/$/,'')}catch(e){return ''}}
function configStatus(){const url=normalizeSupabaseUrl(window.SUPABASE_URL);const key=String(window.SUPABASE_KEY||'').trim();return{url,key,urlOK:/^https:\/\/[^\s]+\.supabase\.co$/i.test(url),keyOK:key.length>20&&!key.includes('YOUR_')}}

function defects(){
  nav('nDef');
  const view=document.getElementById('view');
  if(!view)return;
  view.innerHTML=`<div class="section"><span class="muted">${esc(trText('Loading defect register…'))}</span></div>`;
  const render=()=>{
    try{
      renderDefectRegister(defectCache,defectFilters);
      return true;
    }catch(e){
      view.innerHTML=`<div class="section error"><h3>${esc(trText('Defect Register could not be loaded'))}</h3><p>${esc(e?.message||e)}</p><button class="secondary" onclick="defects()">${esc(trText('Retry'))}</button></div>`;
      return false;
    }
  };
  // Render immediately from the already loaded dashboard cache. Never block the UI on a second request.
  if(warehouses.length && defectCache.length){render();return;}
  Promise.all([
    warehouses.length?Promise.resolve(warehouses):loadWarehouses(),
    defectCache.length?Promise.resolve(defectCache):loadDefects()
  ]).then(()=>render()).catch(e=>{
    view.innerHTML=`<div class="section error"><h3>${esc(trText('Defect Register could not be loaded'))}</h3><p>${esc(e?.message||e)}</p><button class="secondary" onclick="defects()">${esc(trText('Retry'))}</button></div>`;

const patch={[key]:value||null};if(key==='status'&&value==='Completed')patch.completed_at=new Date().toISOString();if(key==='status'&&value==='Verified')patch.verified_at=new Date().toISOString();if(key==='status'&&value==='Closed'){patch.closed_by=user?.email||null;patch.closed_at=new Date().toISOString()}if(key==='status'&&value!=='Closed'&&d.status==='Closed'){patch.closed_by=null;patch.closed_at=null}if(key==='status'&&value!=='Verified'&&d.status==='Verified')patch.verified_at=null;if((key==='status'&&['Verified','Closed'].includes(value))&&d.verification_note)patch.verification_note=d.verification_note;const r=await sb.from('defects').update(patch).eq('id',id);if(r.error){toast(r.error.message,'err');return}Object.assign(d,patch);await auditLog('UPDATE','defect',id,{warehouse:d.warehouses?.name||'',area:d.area,description:d.description,field:key,from:oldValue,to:value||null,verification_note:d.verification_note||null,summary:key==='status'?`Status changed: ${oldValue||'—'} → ${value}`:`${key} updated`});toast(key==='status'?`Defect moved to ${value}`:'Defect updated','ok');renderDefectRegister(defectCache,defectFilters)}

function printWarehouseReport(){const wid=document.getElementById('reportWarehouse').value,w=warehouses.find(x=>String(x.id)===String(wid)),rows=allInspections.filter(i=>String(i.warehouse_id)===String(wid)).map(i=>`<tr><td>${esc(i.inspection_date)}</td><td>${esc(i.inspector||'')}</td><td>${esc(getOverallStatus(i))}</td><td>${esc(i.overall_comment||'')}</td></tr>`).join('');reportWindow(`${w?.name||'Warehouse'} — Inspection History`,`<div class="k"><span>Total inspections</span><b>${allInspections.filter(i=>String(i.warehouse_id)===String(wid)).length}</b></div><table><tr><th>Date</th><th>Inspector</th><th>Result</th><th>Overall comment</th></tr>${rows}</table>`)}
function printMonthlyReport(){const now=new Date(),m=now.getMonth(),y=now.getFullYear(),ins=allInspections.filter(i=>{const d=new Date(i.inspection_date+'T12:00:00');return d.getMonth()===m&&d.getFullYear()===y}),open=defectCache.filter(d=>d.status!=='Closed'),rows=ins.map(i=>`<tr><td>${esc(i.inspection_date)}</td><td>${esc(i.warehouses?.name||'')}</td><td>${esc(i.inspector||'')}</td><td>${esc(getOverallStatus(i))}</td></tr>`).join('');reportWindow(`Monthly Facility Summary — ${y}-${String(m+1).padStart(2,'0')}`,`<div class="k"><span>Inspections this month</span><b>${ins.length}</b></div><div class="k"><span>Open defects</span><b>${open.length}</b></div><table><tr><th>Date</th><th>Warehouse</th><th>Inspector</th><th>Result</th></tr>${rows||'<tr><td colspan="4">No inspections this month.</td></tr>'}</table>`)}
async function audit(){nav('nAudit');const view=document.getElementById('view');try{const r=await sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(250);if(r.error){view.innerHTML=`<div class="section hero"><h2>Audit Log</h2><div class="warnbox">The audit table is not installed yet. Run <b>schema_professional_upgrade.sql</b> in Supabase SQL Editor to enable this module.</div><button onclick="dashboard()">Back to Dashboard</button></div>`;return}const data=r.data||[];view.innerHTML=`<div class="section hero"><div class="toolbar" style="justify-content:space-between"><div><h2>Audit Log</h2><div class="muted">A human-readable history of who changed what and when.</div></div><button class="secondary" onclick="audit()">Refresh</button></div></div><div class="tablewrap"><table style="min-width:950px"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>What changed</th></tr></thead><tbody>${data.length?data.map(x=>`<tr><td class="nowrap">${esc(new Date(x.created_at).toLocaleString())}</td><td>${esc(x.user_email||'')}</td><td><span class="status ${x.action==='UPDATE'?'inprogress':x.action==='CREATE'?'completed':'none'}">${esc(x.action||'')}</span></td><td>${esc(x.entity||'')}</td><td>${auditSummary(x)}</td></tr>`).join(''):'<tr><td colspan="5">No audit records.</td></tr>'}</tbody></table></div>`}catch(e){view.innerHTML=`<div class="error">${esc(e.message)}</div>`}}

function v16t(k){return V16[currentLang()]?.[k]||V16.en[k]||k}
let warehousePhotoUrls={};
async function loadWarehousePhotoUrls(list){
  warehousePhotoUrls={};
  const rows=(list||warehouses||[]).filter(w=>w.photo_path);
  for(const w of rows){
    try{
      const r=await sb.storage.from('inspection-photos').createSignedUrl(w.photo_path,86400);
      if(!r.error&&r.data?.signedUrl) warehousePhotoUrls[String(w.id)]=r.data.signedUrl;
    }catch(e){}
  }
  return warehousePhotoUrls;
}
function warehousePhotoMarkup(w, extraClass=''){
  const u=warehousePhotoUrls[String(w.id)];
  return u ? `<img class=\"warehouse-photo-img ${extraClass}\" src=\"${esc(u)}\" alt=\"${esc(w.name)}\" loading=\"lazy\">` : '';
}
async function uploadWarehousePhoto(id,inputId){
  const input=document.getElementById(inputId);
  const file=input?.files?.[0];
  if(!file)return;
  if(!file.type.startsWith('image/')){toast(trText('Please select an image'),'err');return;}
  try{
    const row=(warehouses||[]).find(w=>String(w.id)===String(id));
    if(!row)throw new Error('Warehouse not found');
    const f=await compressImage(file);
    const ext=(f.type||'image/jpeg').split('/')[1]||'jpeg';
    const path=`warehouse-covers/${id}-${Date.now()}.${ext}`;
    const up=await sb.storage.from('inspection-photos').upload(path,f,{upsert:false,contentType:f.type||'image/jpeg'});
    if(up.error)throw up.error;
    if(row.photo_path){try{await sb.storage.from('inspection-photos').remove([row.photo_path]);}catch(e){}}
    const db=await sb.from('warehouses').update({photo_path:path}).eq('id',id);
    if(db.error){try{await sb.storage.from('inspection-photos').remove([path]);}catch(e){};throw db.error;}
    row.photo_path=path;
    await loadWarehousePhotoUrls([row]);
    toast(trText('Warehouse photo saved'),'ok');
    settings();
  }catch(e){toast(trText('Warehouse photo upload failed: ')+e.message,'err');}
}
async function removeWarehousePhoto(id){
  try{
    const row=(warehouses||[]).find(w=>String(w.id)===String(id));
    if(!row)return;
    if(row.photo_path){const r=await sb.storage.from('inspection-photos').remove([row.photo_path]);if(r.error)throw r.error;}
    const db=await sb.from('warehouses').update({photo_path:null}).eq('id',id);
    if(db.error)throw db.error;
    row.photo_path=null;
    delete warehousePhotoUrls[String(id)];
    toast(trText('Warehouse photo removed'),'ok');
    settings();
  }catch(e){toast(trText('Warehouse photo removal failed: ')+e.message,'err');}
}

async function viewInspection(id){v16nav('nInspect');const view=document.getElementById('view');view.innerHTML='<div class="section">Loading…</div>';try{const ir=await sb.from('inspections').select('*,warehouses(name)').eq('id',id).single();if(ir.error)throw ir.error;const [itp,php]=await Promise.all([sb.from('inspection_items').select('*').eq('inspection_id',id).order('created_at'),sb.from('inspection_photos').select('*').eq('inspection_id',id).order('created_at')]);if(itp.error)throw itp.error;if(php.error)throw php.error;const photoMap={};for(const ph of php.data||[]){const sr=await sb.storage.from('inspection-photos').createSignedUrl(ph.storage_path,3600);if(!photoMap[ph.area])photoMap[ph.area]=[];if(!sr.error)photoMap[ph.area].push(sr.data.signedUrl)}const items=itp.data||[],st=getOverallStatus({inspection_items:items});const itemHtml=items.map((it,n)=>`<div class="check-item ${it.status==='Critical'?'crit':it.status==='Attention'?'attn':''}"><div class="check-top"><div><div class="check-title">${n+1}. ${esc(v16area(it.area))}</div><div class="check-desc">${esc(it.area)}</div></div><span class="status-pill ${v16cls(it.status)}">${esc(v16status(it.status))}</span></div>${it.finding?`<p class="defect-desc">${esc(it.finding)}</p>`:''}${(photoMap[it.area]||[]).length?`<div class="photo-grid">${photoMap[it.area].map(u=>`<a href="${u}" target="_blank"><img class="photo-thumb" src="${u}"></a>`).join('')}</div>`:''}${it.responsible_name?`<div class="defect-meta">${esc(v16t('Responsible'))}: ${esc(it.responsible_name)}</div>`:''}</div>`).join('');view.innerHTML=`<div class="content-head"><div><h2>${v16t('Inspection')}: ${esc(ir.data.warehouses?.name||'')}</h2><p>${esc(ir.data.inspection_date||'')} · ${esc(ir.data.inspector||'')}</p></div><span class="status-pill ${v16cls(st)}">${esc(v16status(st))}</span></div><div class="section"><div class="stepper"><div class="step active"><span class="circle">✓</span>${v16t('Inspection')}</div><div class="step-line"></div><div class function renderDefectRegister(data,filters){const view=document.getElementById('view');if(!view)return;data=Array.isArray(data)?data:[];filters=filters||defectFilters;const open=data.filter(d=>d.status!=='Closed'),overdue=open.filter(d=>isOverdue(d.due_date)),critical=open.filter(d=>d.priority==='Critical');const filtered=data.filter(d=>defectMatches(d,filters));const cards=filtered.map(d=>`<article class="defect-card ${d.priority==='Critical'?'critical':'attention'}"><div class="defect-top"><div><h3>${esc(d.warehouses?.name||'')} · ${esc(v16area(d.area||'Other'))}</h3><div class="defect-meta">${esc((d.created_at||'').slice(0,10))} · ${esc(d.area||'')}</div></div><span class="status-pill ${v16cls(d.priority)}">${esc(v16status(d.priority))}</span></div><p class="defect-desc">${esc(d.description||'')}</p><div class="defect-fields"><div><label>${v16t('Responsible')}</label><input value="${esc(d.responsible||'')}" onchange="updateDefect('${d.id}','responsible',this.value)"></div><div><label>${v16t('Due')}</label><input type="date" value="${esc(d.due_date||'')}" onchange="updateDefect('${d.id}','due_date',this.value)"></div><div><label>${v16t('Status')}</label><select onchange="updateDefect('${d.id}','status',this.value)">${['Open','In Progress','Completed','Verified','Closed'].map(x=>`<option value="${x}" ${d.status===x?'selected':''}>${esc(trText(x))}</option>`).join('')}</select></div></div></article>`).join('')||`<div class="empty-state">${v16t('NoDefects')}</div>`;view.innerHTML=`<div class="content-head"><div><h2>${v16t('DefectRegister')}</h2><p>${v16t('OpenDefects')}: ${open.length} · ${v16t('Critical')}: ${critical.length} · ${v16t('Overdue')}: ${overdue.length}</p></div><div class="head-actions"><button class="ghost-btn" onclick="exportDefects()">CSV</button></div></div><div class="compact-kpis"><div class="compact-kpi"><span>${v16t('OpenDefects')}</span><b>${open.length}</b></div><div class="compact-kpi"><span>${v16t('Critical')}</span><b>${critical.length}</b> function defects(){v16nav('nDef');if(!warehouses.length||!defectCache.length){const view=document.getElementById('view');view.innerHTML=`<div class="section">Loading…</div>`;Promise.all([warehouses.length?Promise.resolve():loadWarehouses(),defectCache.length?Promise.resolve():loadDefects()]).then(()=>renderDefectRegister(defectCache,defectFilters)).catch(e=>{view.innerHTML=`<div class="section error">${esc(e.message)}</div>`})}else renderDefectRegister(defectCache,defectFilters)}
