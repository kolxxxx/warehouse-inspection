<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text);padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,#102a43,#1f4e79);color:#fff;padding:15px 18px;position:sticky;top:0;z-index:20}.head{max-width:1280px;margin:auto;display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{display:flex;gap:10px;align-items:center}.brand h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.78;margin-top:3px}.userbox{font-size:12px;display:flex;align-items:center;gap:8px}.userbox button{padding:8px 12px}
.container{max-width:1280px;margin:auto;padding:14px}.nav{display:flex;gap:5px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:14px;overflow:auto;box-shadow:var(--shadow)}.nav button{white-space:nowrap;flex:1;background:transparent;color:#536675}.nav button.active{background:var(--navy);color:#fff}
button{border:0;border-radius:9px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;transition:.15s}button:hover{filter:brightness(1.07)}button:disabled{opacity:.55;cursor:not-allowed}button.secondary{background:#e8eff4;color:var(--navy)}button.good{background:var(--green)}button.bad{background:var(--red)}button.link{background:transparent;color:var(--blue);padding:5px 7px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.section,.card,.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.section{margin-bottom:13px}.hero{padding:20px}.hero h2{margin:0 0 6px;font-size:24px}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:13px 0}.kpi span{font-size:12px;color:var(--muted)}.kpi b{font-size:26px;display:block;margin-top:5px}.kpi .hint{font-size:11px;color:var(--muted);margin-top:4px}.progress{height:8px;background:#e8edf1;border-radius:8px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--green);border-radius:8px}
.status{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800;white-space:nowrap}.ok{background:var(--greenbg);color:#19713a}.attention{background:var(--yellowbg);color:#8d5b00}.critical{background:var(--redbg);color:#a62d23}.none{background:var(--graybg);color:#63727d}.inprogress{background:#e4eefb;color:#235b98}.completed{background:#e7f3ed;color:#23724b}.verified{background:#e9e5fb;color:#5b43a5}.overdue{background:var(--redbg);color:var(--red)}.audit-detail{font-size:12px;line-height:1.45}.audit-old{color:#71808d}.audit-new{font-weight:700}.transition-note{font-size:11px;color:#71808d;margin-top:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-weight:700;font-size:13px;display:block;margin:10px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd7df;border-radius:8px;background:#fff;font-size:14px;color:var(--text)}textarea{min-height:78px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #b7d5ef;border-color:#7eb6e6}

.item{border:1px solid var(--line);border-radius:12px;padding:13px;margin:9px 0;background:#fbfcfd}.item.attn{border-left:4px solid #d68a00}.item.crit{border-left:4px solid #c0392b}.itemtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.itemtitle{font-weight:800}.photo-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.photo-thumb{width:110px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}.readonly{background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:10px;min-height:42px;white-space:pre-wrap}.note{background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:11px;margin-top:10px}

.filterbar{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:8px;margin:12px 0}.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.mini{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:11px}.mini b{font-size:20px;display:block;margin-top:2px}.history-actions{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:28px;text-align:center;color:var(--muted)}
.error{background:#fee5e2;color:#9f2b22;padding:11px;border-radius:8px;margin:10px 0;font-size:13px}.success{background:#e7f6eb;color:#196b35;padding:11px;border-radius:8px;margin:10px 0;font-size:13px}.warnbox{background:#fff7df;color:#775200;padding:11px;border-radius:8px;margin:10px 0;font-size:13px}.hidden{display:none}.smallbtn{padding:8px 10px;font-size:12px}.diag{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.diagrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #eef2f5;font-size:13px}.pass{color:var(--green);font-weight:700}.fail{color:var(--red);font-weight:700}

html{color-scheme:light}body{transition:background .2s,color .2s}.nav{position:sticky;top:74px;z-index:15;backdrop-filter:blur(12px);background:rgba(255,255,255,.94)}.nav button{border:1px solid transparent;font-size:12px;letter-spacing:.1px}.nav button.active{box-shadow:0 2px 8px rgba(16,42,67,.16)}.section,.card,.kpi,.report-card{transition:background .2s,border-color .2s,box-shadow .2s}.section:hover,.card:hover,.settingsCard:hover{box-shadow:0 5px 20px rgba(16,42,67,.09)}.settingsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.settingsCard{min-height:170px}.settingsTitle{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}.settingsTitle h3{margin:0 0 4px}.settingsIcon{width:42px;height:42px;border-radius:12px;background:#eef4f8;display:grid;place-items:center;font-size:20px;flex:0 0 42px}.eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:800;color:var(--blue);margin-bottom:5px}.themeSwitch{display:grid;grid-template-columns:1fr 1fr;gap:8px}.themeChoice{background:#f4f7f9;color:var(--navy);border:1px solid var(--line);font-weight:700}.themeChoice.selected{background:var(--navy);color:#fff;border-color:var(--navy)}.systemRows>div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.systemRows>div:last-child{border-bottom:0}.warehouseSetting{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:12px 0;border-bottom:1px solid var(--line)}.warehouseSettingMain{display:flex;align-items:center;gap:12px;flex:1}.warehouseNumber{width:40px;height:40px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}.warehouseSettingMain label{margin:0 0 5px}.warehouseSettingActions{display:flex;align-items:center;gap:8px}.settingsHero{display:flex;justify-content:space-between;align-items:center}.status{line-height:1}.modal{border:1px solid var(--line)}
@media(max-width:900px){.settingsGrid{grid-template-columns:1fr 1fr}.nav{top:0}}@media(max-width:760px){.settingsGrid{grid-template-columns:1fr}.warehouseSetting{align-items:flex-start;flex-direction:column}.warehouseSettingActions{width:100%;justify-content:flex-end}.settingsHero{display:block}.nav{position:sticky;top:0}.nav button{flex:0 0 auto}.brand h1{font-size:17px}}
html[data-theme="dark"]{color-scheme:dark}html[data-theme="dark"]{--navy:#dbeafe;--navy2:#17324d;--blue:#72b7ff;--bg:#0b1220;--card:#111b2b;--line:#26374a;--text:#e8eef5;--muted:#9cafc1;--green:#5fd48a;--greenbg:#153a29;--yellow:#f4c55f;--yellowbg:#3d3015;--red:#ff8178;--redbg:#401c1a;--graybg:#1d2938;--shadow:0 4px 18px rgba(0,0,0,.22)}html[data-theme="dark"] body{background:var(--bg);color:var(--text)}html[data-theme="dark"] header{background:linear-gradient(135deg,#091522,#102a43)}html[data-theme="dark"] .nav{background:rgba(17,27,43,.94)}html[data-theme="dark"] button{background:#dbeafe;color:#0b1220}html[data-theme="dark"] button.secondary,.themeChoice{background:#1c2b3c;color:#dbe7f2;border-color:#33485d}html[data-theme="dark"] button.good{background:#257a49;color:#fff}html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:#0e1826;color:var(--text);border-color:#33485d}html[data-theme="dark"] th{background:#172537;color:#dce8f3}html[data-theme="dark"] .item,html[data-theme="dark"] .readonly,html[data-theme="dark"] .note,html[data-theme="dark"] .mini,html[data-theme="dark"] .wh{background:#0f1927}html[data-theme="dark"] .settingsIcon{background:#1a2a3b}html[data-theme="dark"] .warehouseNumber{background:#dbeafe;color:#0b1220}html[data-theme="dark"] .modal{background:#111b2b}html[data-theme="dark"] .modalback{background:rgba(0,0,0,.68)}

<body>
<header><div class="head"><div class="brand"><div style="font-size:24px">🏭</div><div><h1>Warehouse Inspection</h1><div class="sub">Shared cloud system · 15 warehouses</div></div></div><div id="userBox" class="userbox"></div></div></header>
<div class="container">
<div id="login" class="section hidden"></div>
<div id="app" class="hidden">
<div class="nav"><button id="nDash" onclick="dashboard()">📊 Dashboard</button><button id="nInspect" onclick="selectWarehouse()">🏭 Inspections</button><button id="nDef" onclick="defects()">⚠️ Defects</button><button id="nWeekly" onclick="weekly()">📅 Weekly Control</button><button id="nReports" onclick="reports()">📑 Reports</button><button id="nAudit" onclick="audit()">🧾 Audit</button><button id="nSet" onclick="settings()">⚙️ Settings</button></div>
<div id="view"></div>
</div></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>

const {createClient}=supabase;
let sb=null,user=null,warehouses=[],allInspections=[],defectCache=[];
const BASE_AREAS=[['Roof','Leaks, surface damage, drainage'],['Walls & Facade','Cracks, damage, cladding'],['Floor','Potholes, cracks, surface damage'],['Gates & Doors','Operation, locks, hinges, sealing'],['Windows','Glass, frames, sealing'],['Electrical','Lights, panels, cables, sockets'],['Lighting','Internal and external lighting'],['Fire Safety','Fire extinguishers, exits, signs, access'],['Ventilation','Ventilation, grilles, equipment'],['Housekeeping & Order','Waste, access routes, storage'],['Surrounding Area','Roads, drainage, fencing, vegetation']];
function areasFor(id){return Number(id)<=8?[...BASE_AREAS,['Tent Condition','Tears, damage, tension, fixings, frame, leaks']]:BASE_AREAS}
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function safe(s){return String(s||'file').replace(/[^a-zA-Z0-9._-]/g,'_').slice(-90)}
function cls(s){return s==='Critical'?'critical':s==='Attention'?'attention':s==='OK'?'ok':s==='In Progress'?'inprogress':s==='Completed'?'completed':s==='Verified'?'verified':s==='OVERDUE'?'overdue':'none'}
function getOverallStatus(ins){const items=Array.isArray(ins?.inspection_items)?ins.inspection_items:[];if(items.some(x=>x?.status==='Critical'))return 'Critical';if(items.some(x=>x?.status==='Attention'))return 'Attention';return items.length?'OK':'Not Inspected'}
function isOverdue(d){return !!d && d<localDate()}
function toast(msg,type=''){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast ${type}">${esc(msg)}</div>`;setTimeout(()=>r.innerHTML='',3500)}
function showModal(title,html){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2 style="margin:0">${esc(title)}</h2><button class="secondary" onclick="closeModal()">Close</button></div>${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function nav(id){['nDash','nInspect','nDef','nWeekly','nReports','nAudit','nSet'].forEach(x=>{const el=document.getElementById(x);if(el)el.classList.remove('active')});const el=document.getElementById(id);if(el)el.classList.add('active')}
function normalizeSupabaseUrl(raw){try{let u=new URL(String(raw||'').trim());u.pathname='';u.search='';u.hash='';return u.toString().replace(/\/$/,'')}catch(e){return ''}}
function configStatus(){const url=normalizeSupabaseUrl(window.SUPABASE_URL);const key=String(window.SUPABASE_KEY||'').trim();return{url,key,urlOK:/^https:\/\/[^\s]+\.supabase\.co$/i.test(url),keyOK:key.length>20&&!key.includes('YOUR_')}}
function showLogin(msg=''){document.getElementById('app').classList.add('hidden');const el=document.getElementById('login');el.classList.remove('hidden');el.innerHTML=`<h2 style="margin-top:0">Warehouse Inspection</h2><p class="muted">Secure shared inspection system for terminal warehouses.</p>${msg?`<div class="error">${esc(msg)}</div>`:''}<label>Email</label><input id="email" type="email" placeholder="name@company.com"><label>Password</label><input id="pass" type="password" placeholder="Password"><div class="toolbar" style="margin-top:14px"><button onclick="signIn()">Sign In</button><button class="secondary" onclick="signUp()">Create Account</button><button class="secondary smallbtn" onclick="testConnection()">Test Connection</button></div><div id="diagnostics"></div>`}
async function testConnection(){const box=document.getElementById('diagnostics');if(!box)return;const c=configStatus();box.innerHTML=`<div class="diag"><b>Connection diagnostics</b><div class="diagrow"><span>Supabase URL</span><span class="${c.urlOK?'pass':'fail'}">${c.urlOK?'OK':'ERROR'}</span></div><div class="diagrow"><span>Publishable key</span><span class="${c.keyOK?'pass':'fail'}">${c.keyOK?'OK':'ERROR'}</span></div></div>`;if(!c.urlOK||!c.keyOK)return;const client=sb||createClient(c.url,c.key);let authOK=false,dbOK=false,storageOK=false,details=[];try{const r=await client.auth.getSession();authOK=!r.error;if(r.error)details.push('Authentication: '+r.error.message)}catch(e){details.push('Authentication: '+e.message)}try{const r=await client.from('warehouses').select('id').limit(1);dbOK=!r.error;if(r.error)details.push('Database: '+r.error.message)}catch(e){details.push('Database: '+e.message)}try{const r=await client.storage.from('inspection-photos').list('',{limit:1});storageOK=!r.error;if(r.error)details.push('Storage: '+r.error.message)}catch(e){details.push('Storage: '+e.message)}box.innerHTML+=`<div class="diag"><div class="diagrow"><span>Authentication</span><span class="${authOK?'pass':'fail'}">${authOK?'OK':'ERROR'}</span></div><div class="diagrow"><span>Database</span><span class="${dbOK?'pass':'fail'}">${dbOK?'OK':'ERROR'}</span></div><div class="diagrow"><span>Photo Storage</span><span class="${storageOK?'pass':'fail'}">${storageOK?'OK':'ERROR'}</span></div></div>${details.length?`<div class="error">${details.map(esc).join('<br>')}</div>`:'<div class="success"><b>Connection test passed.</b></div>'}`}
async function init(){const c=configStatus();if(!c.urlOK||!c.keyOK){showLogin('Please configure config.js with your Supabase URL and publishable key.');return}sb=createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});try{const r=await sb.auth.getSession();if(r.error){showLogin(r.error.message);return}user=r.data.session?.user||null;renderAuth()}catch(e){showLogin(e.message)}sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;renderAuth()})}
async function signIn(){const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;const r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)showLogin(r.error.message)}
async function signUp(){const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;if(p.length<6){showLogin('Password must contain at least 6 characters.');return}const r=await sb.auth.signUp({email:e,password:p});if(r.error)showLogin(r.error.message);else showLogin('Account created. If email confirmation is enabled, confirm the email before signing in.')}
async function signOut(){await sb.auth.signOut()}
function renderAuth(){if(!user){showLogin();return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userBox').innerHTML=`<span>${esc(user.email||'')}</span><button class="secondary" onclick="signOut()">Sign out</button>`;dashboard()}
async function loadWarehouses(){const r=await sb.from('warehouses').select('*').eq('active',true).order('sort_order');if(r.error)throw r.error;warehouses=r.data||[];return warehouses}
async function loadInspections(){const r=await sb.from('inspections').select('*,warehouses(name),inspection_items(status)').order('created_at',{ascending:false});if(r.error)throw r.error;allInspections=r.data||[];return allInspections}
async function loadDefects(){const r=await sb.from('defects').select('*,warehouses(name)').order('created_at',{ascending:false});if(r.error)throw r.error;defectCache=r.data||[];return defectCache}
function lastByWarehouse(ins){const m={};for(const i of ins){if(!m[i.warehouse_id])m[i.warehouse_id]=i}return m}
function openDefects(defs){return defs.filter(d=>d.status!=='Closed')}
function dashboard(){nav('nDash');loadDashboard()}
async function loadDashboard(){const view=document.getElementById('view');view.innerHTML='<div class="section">Loading dashboard…</div>';try{await Promise.all([loadWarehouses(),loadInspections(),loadDefects()]);const last=lastByWarehouse(allInspections),active=warehouses.length,inspected=warehouses.filter(w=>last[w.id]).length,open=openDefects(defectCache),critical=open.filter(d=>d.priority==='Critical').length,overdue=open.filter(d=>isOverdue(d.due_date)).length,ok=warehouses.filter(w=>last[w.id]&&getOverallStatus(last[w.id])==='OK').length,coverage=active?Math.round(inspected/active*100):0;view.innerHTML=`<div class="section hero"><h2>Inspection Dashboard</h2><div class="muted">Shared data from all devices. All inspection records are retained in the database.</div><div class="progress"><i style="width:${coverage}%"></i></div><div class="muted">Inspection coverage: ${coverage}% · ${inspected} of ${active} active warehouses inspected</div></div><div class="kpis"><div class="kpi"><span>Inspected</span><b>${inspected}/${active}</b><div class="hint">Active warehouses</div></div><div class="kpi"><span>No Issues</span><b>${ok}</b><div class="hint">Latest status OK</div></div><div class="kpi"><span>Critical Open</span><b>${critical}</b><div class="hint">Needs priority action</div></div><div class="kpi"><span>Overdue</span><b>${overdue}</b><div class="hint">Open past due date</div></div><div class="kpi"><span>Total Inspections</span><b>${allInspections.length}</b><div class="hint">All historical records</div></div></div><div class="section"><div class="toolbar" style="justify-content:space-between"><div><h3 style="margin:0">Warehouses</h3><div class="muted">Open the latest inspection, review history, or start a new inspection.</div></div><button class="secondary" onclick="defects()">Open Defect Register</button></div></div><div class="grid">${warehouses.map(w=>{const i=last[w.id],s=i?getOverallStatus(i):'Not Inspected',hist=allInspections.filter(x=>x.warehouse_id===w.id).length;return `<div class="card"><h3 style="margin-top:0">${esc(w.name)}</h3><span class="status ${cls(s)}">${esc(s)}</span><p class="muted">${i?`Last inspection: ${esc(i.inspection_date)}`:'No inspection yet'}</p><div class="history-actions">${i?`<button onclick="viewInspection('${i.id}')">Open Last Inspection</button><button class="secondary" onclick="startInspection(${w.id})">Start New Inspection</button>`:`<button onclick="startInspection(${w.id})">Start Inspection</button>`}${hist?`<button class="secondary" onclick="showHistory(${w.id})">View Inspection History (${hist})</button>`:''}</div></div>`}).join('')}</div><div id="historyPanel"></div>`}catch(e){view.innerHTML=`<div class="error">Dashboard could not be loaded: ${esc(e.message)}</div>`}}
async function showHistory(wid){try{const name=(warehouses.find(w=>String(w.id)===String(wid))||{}).name||'Warehouse';const rows=allInspections.filter(i=>String(i.warehouse_id)===String(wid));showModal(`${name} — Inspection History`,`<div class="muted">${rows.length} historical inspection record(s) retained</div><div class="tablewrap" style="margin-top:12px"><table style="min-width:700px"><thead><tr><th>Date</th><th>Status</th><th>Inspector</th><th>Issues</th><th>Action</th></tr></thead><tbody>${rows.map(i=>{const st=getOverallStatus(i),items=i.inspection_items||[],issues=items.filter(x=>x.status==='Attention'||x.status==='Critical').length;return `<tr><td class="nowrap">${esc(i.inspection_date||'')}</td><td><span class="status ${cls(st)}">${st}</span></td><td>${esc(i.inspector||'')}</td><td>${issues}</td><td><button onclick="closeModal();viewInspection('${i.id}')">Open</button></td></tr>`}).join('')}</tbody></table></div>`)}catch(e){toast(e.message,'err')}}
async function selectWarehouse(){nav('nInspect');try{await Promise.all([loadWarehouses(),loadInspections()]);const last=lastByWarehouse(allInspections);document.getElementById('view').innerHTML=`<div class="section"><h2>Select Warehouse</h2><div class="muted">Choose a warehouse to inspect or review its latest record.</div><div class="whgrid" style="margin-top:12px">${warehouses.map(w=>{const i=last[w.id],s=i?getOverallStatus(i):'Not Inspected';return `<div><button class="wh" onclick="${i?`viewInspection('${i.id}')`:`startInspection(${w.id})`}"><strong>${esc(w.name)}</strong><small>${i?`Last: ${esc(i.inspection_date)} · ${esc(s)}`:'No inspection yet'}</small></button>${i?`<button class="secondary" style="width:100%;margin-top:5px" onclick="startInspection(${w.id})">New Inspection</button>`:''}</div>`}).join('')}</div></div>`}catch(e){document.getElementById('view').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function startInspection(wid){nav('nInspect');const w=warehouses.find(x=>String(x.id)===String(wid));if(!w){toast('Warehouse not found','err');return}const arr=areasFor(wid);document.getElementById('view').innerHTML=`<div class="section"><button class="secondary" onclick="selectWarehouse()">← Back</button><div class="toolbar" style="justify-content:space-between;margin-top:10px"><div><h2 style="margin:0">New Inspection — ${esc(w.name)}</h2><div class="muted">Complete every checkpoint. Use Attention/Critical when action is required.</div></div><span class="status none">Draft · not saved</span></div><div class="row"><div><label>Date</label><input id="date" type="date" value="${localDate()}"></div><div><label>Inspector</label><input id="inspector" value="${esc(user?.email||'')}"></div></div></div><div class="section"><h3 style="margin-top:0">Inspection Checklist</h3>${arr.map((a,n)=>`<div class="item" id="item${n}"><div class="itemtop"><div><div class="itemtitle">${n+1}. ${esc(a[0])}</div><div class="muted">${esc(a[1])}</div></div><select id="st${n}" onchange="highlightItem(${n})"><option>OK</option><option>Attention</option><option>Critical</option><option>N/A</option></select></div><label>Comment / Finding</label><textarea id="fd${n}" placeholder="Describe the condition or finding…"></textarea><label>Photos</label><input id="ph${n}" type="file" accept="image/*,.heic,.heif" capture="environment" multiple><div class="muted photo-hint">Photos are automatically converted to JPEG for reliable viewing on all devices.</div></div>`).join('')}<label>Overall Comment</label><textarea id="overallComment" placeholder="Optional summary of the inspection…"></textarea><div class="toolbar" style="margin-top:12px"><button class="good" id="saveBtn" onclick="saveInspection(${wid})">💾 Save Inspection</button><button class="secondary" onclick="selectWarehouse()">Cancel</button></div></div>`}
function highlightItem(n){const el=document.getElementById('item'+n),st=document.getElementById('st'+n).value;el.classList.toggle('attn',st==='Attention');el.classList.toggle('crit',st==='Critical')}
async function compressImage(file){if(!file||!file.type.startsWith('image/'))return file;try{const bitmap=await createImageBitmap(file);const max=1800;const scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));const c=document.createElement('canvas');c.width=Math.round(bitmap.width*scale);c.height=Math.round(bitmap.height*scale);const ctx=c.getContext('2d');ctx.drawImage(bitmap,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return blob?new File([blob],safe(file.name).replace(/\.[^.]+$/i,'.jpg'),{type:'image/jpeg'}):file}catch(e){return file}}
async function saveInspection(wid){const btn=document.getElementById('saveBtn');if(btn.disabled)return;btn.disabled=true;btn.textContent='Saving…';const arr=areasFor(wid);const inspector=document.getElementById('inspector').value.trim();const date=document.getElementById('date').value;if(!inspector||!date){toast('Inspector and date are required.','err');btn.disabled=false;btn.textContent='💾 Save Inspection';return}let createdId=null,warnings=[];try{const r=await sb.from('inspections').insert({warehouse_id:wid,inspector,inspection_date:date,overall_comment:document.getElementById('overallComment').value.trim()}).select().single();if(r.error)throw r.error;createdId=r.data.id;const itemRows=[];for(let n=0;n<arr.length;n++){itemRows.push({inspection_id:createdId,area:arr[n][0],status:document.getElementById('st'+n).value,finding:document.getElementById('fd'+n).value.trim()})}const ir=await sb.from('inspection_items').insert(itemRows);if(ir.error)throw ir.error;const defectRows=[];for(let n=0;n<arr.length;n++){const st=document.getElementById('st'+n).value,f=document.getElementById('fd'+n).value.trim();if(st==='Attention'||st==='Critical')defectRows.push({inspection_id:createdId,warehouse_id:wid,area:arr[n][0],description:f||'Inspection finding',priority:st,status:'Open'})}if(defectRows.length){const dr=await sb.from('defects').insert(defectRows).select('id,area,priority,description');if(dr.error)warnings.push('Defect register update failed: '+dr.error.message);else for(const d of dr.data||[]) await auditLog('CREATE','defect',d.id,{warehouse_id:wid,warehouse:(warehouses.find(w=>String(w.id)===String(wid))||{}).name||'',area:d.area,priority:d.priority,description:d.description,status:'Open'})}for(let n=0;n<arr.length;n++){const input=document.getElementById('ph'+n),files=input?.files?Array.from(input.files):[];for(const original of files){try{const f=await compressImage(original);const path=`${createdId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safe(f.name)}`;const up=await sb.storage.from('inspection-photos').upload(path,f,{upsert:false,contentType:f.type||'image/jpeg'});if(up.error){warnings.push(`Photo upload failed for ${arr[n][0]}`);continue}const pr=await sb.from('inspection_photos').insert({inspection_id:createdId,area:arr[n][0],storage_path:path});if(pr.error)warnings.push(`Photo record failed for ${arr[n][0]}`)}catch(e){warnings.push(`Photo processing failed for ${arr[n][0]}`)}}}await auditLog('CREATE','inspection',createdId,{warehouse_id:wid,inspection_date:date,warning_count:warnings.length});toast(warnings.length?`Inspection saved with ${warnings.length} warning(s).`:'Inspection saved successfully.','ok');await loadInspections();await loadDefects();dashboard()}catch(e){if(createdId)await sb.from('inspections').delete().eq('id',createdId);toast('Inspection was not saved: '+e.message,'err');btn.disabled=false;btn.textContent='💾 Save Inspection'}}
async function viewInspection(id){nav('nInspect');document.getElementById('view').innerHTML='<div class="section">Loading inspection…</div>';try{const ir=await sb.from('inspections').select('*,warehouses(name)').eq('id',id).single();if(ir.error)throw ir.error;const [itp,php]=await Promise.all([sb.from('inspection_items').select('*').eq('inspection_id',id).order('created_at'),sb.from('inspection_photos').select('*').eq('inspection_id',id).order('created_at')]);if(itp.error)throw itp.error;if(php.error)throw php.error;const photoMap={};for(const ph of php.data||[]){const sr=await sb.storage.from('inspection-photos').createSignedUrl(ph.storage_path,3600);if(!photoMap[ph.area])photoMap[ph.area]=[];if(!sr.error)photoMap[ph.area].push(sr.data.signedUrl)}const items=itp.data||[],st=getOverallStatus({inspection_items:items});document.getElementById('view').innerHTML=`<div class="section"><div class="toolbar"><button class="secondary" onclick="dashboard()">← Dashboard</button><button class="secondary" onclick="showHistory(${ir.data.warehouse_id})">Inspection History</button></div><div class="toolbar" style="justify-content:space-between;margin-top:12px"><div><h2 style="margin:0">Inspection — ${esc(ir.data.warehouses?.name||'')}</h2><div class="muted">${esc(ir.data.inspection_date||'')} · ${esc(ir.data.inspector||'')}</div></div><span class="status ${cls(st)}">${esc(st)}</span></div>${ir.data.overall_comment?`<div class="note"><b>Overall Comment</b><div>${esc(ir.data.overall_comment)}</div></div>`:''}</div><div class="section"><h3 style="margin-top:0">Inspection Checklist</h3>${items.map((it,n)=>`<div class="item ${it.status==='Critical'?'crit':it.status==='Attention'?'attn':''}"><div class="itemtop"><div class="itemtitle">${n+1}. ${esc(it.area)}</div><span class="status ${cls(it.status)}">${esc(it.status)}</span></div><label>Comment / Finding</label><div class="readonly">${it.finding?esc(it.finding):'No finding recorded.'}</div>${(photoMap[it.area]||[]).length?`<label>Photos</label><div class="photo-grid">${photoMap[it.area].map(u=>`<a href="${u}" target="_blank" rel="noopener"><img class="photo-thumb" src="${u}" alt="Inspection photo"></a>`).join('')}</div>`:''}</div>`).join('')}</div><div class="section"><button class="good" onclick="startInspection(${ir.data.warehouse_id})">＋ Start New Inspection</button></div>`}catch(e){document.getElementById('view').innerHTML=`<div class="error">Could not open inspection: ${esc(e.message)}</div>`}}
function defectPriorityClass(p){return p==='Critical'?'critical':'attention'}
function defectMatches(d,filters){const q=filters.q.toLowerCase();const txt=[d.warehouses?.name,d.area,d.description,d.responsible].join(' ').toLowerCase();return(!q||txt.includes(q))&&(!filters.w||String(d.warehouse_id)===filters.w)&&(!filters.p||d.priority===filters.p)&&(!filters.s||d.status===filters.s)&&(!filters.due||(filters.due==='overdue'?(isOverdue(d.due_date)&&d.status!=='Closed'):filters.due==='nodue'&&!d.due_date))}
function renderDefectRegister(data,filters){const open=data.filter(d=>d.status!=='Closed'),overdue=open.filter(d=>isOverdue(d.due_date)),critical=open.filter(d=>d.priority==='Critical'),completed=data.filter(d=>d.status==='Completed'),verified=data.filter(d=>d.status==='Verified'),closed=data.filter(d=>d.status==='Closed');const warehousesOptions=warehouses.map(w=>`<option value="${w.id}" ${filters.w===String(w.id)?'selected':''}>${esc(w.name)}</option>`).join('');const filtered=data.filter(d=>defectMatches(d,filters));const statuses=['Open','In Progress','Completed','Verified','Closed'];document.getElementById('view').innerHTML=`<div class="section hero"><div class="toolbar" style="justify-content:space-between"><div><h2 style="margin:0">Defect Register</h2><div class="muted">Lifecycle: Open → In Progress → Completed → Verified → Closed. Closed defects can be reopened as Open.</div></div><div class="toolbar"><button class="secondary" onclick="exportDefects()">Export CSV</button><button onclick="dashboard()">Dashboard</button></div></div></div><div class="summary-strip"><div class="mini"><span class="muted">Open</span><b>${open.length}</b></div><div class="mini"><span class="muted">Overdue</span><b>${overdue.length}</b></div><div class="mini"><span class="muted">Critical Open</span><b>${critical.length}</b></div><div class="mini"><span class="muted">Completed</span><b>${completed.length}</b></div><div class="mini"><span class="muted">Verified</span><b>${verified.length}</b></div><div class="mini"><span class="muted">Closed</span><b>${closed.length}</b></div></div><div class="section"><div class="filterbar"><input id="fq" placeholder="Search warehouse, area, description, responsible…" value="${esc(filters.q)}"><select id="fw"><option value="">All warehouses</option>${warehousesOptions}</select><select id="fp"><option value="">All priorities</option><option ${filters.p==='Attention'?'selected':''}>Attention</option><option ${filters.p==='Critical'?'selected':''}>Critical</option></select><select id="fs"><option value="">All statuses</option>${statuses.map(x=>`<option ${filters.s===x?'selected':''}>${x}</option>`).join('')}</select><select id="fdue"><option value="">All due dates</option><option value="overdue" ${filters.due==='overdue'?'selected':''}>Overdue</option><option value="nodue" ${filters.due==='nodue'?'selected':''}>No due date</option></select><button class="secondary" onclick="applyDefectFilters()">Filter</button></div><div class="toolbar" style="margin-bottom:10px"><button class="link" onclick="clearDefectFilters()">Clear filters</button><span class="muted">Showing ${filtered.length} of ${data.length} defects</span></div><div class="tablewrap"><table style="min-width:1250px"><thead><tr><th>Date</th><th>Warehouse</th><th>Area</th><th>Description</th><th>Priority</th><th>Responsible</th><th>Due Date</th><th>Status</th><th>Verification Note</th><th>Inspection</th></tr></thead><tbody>${filtered.length?filtered.map(d=>{const od=isOverdue(d.due_date)&&!['Closed','Verified'].includes(d.status);const transitionHint=d.status==='Completed'?'Awaiting verification':d.status==='Verified'?'Ready for closure':'';return `<tr class="${od?'overdue-row':''} ${d.status==='Closed'?'closed-row':''}"><td class="nowrap">${esc((d.created_at||'').slice(0,10))}</td><td>${esc(d.warehouses?.name||'')}</td><td>${esc(d.area)}</td><td class="desc">${esc(d.description)}</td><td><span class="status ${defectPriorityClass(d.priority)}">${esc(d.priority)}</span></td><td><input value="${esc(d.responsible||'')}" list="responsibleList" onchange="updateDefect('${d.id}','responsible',this.value)"></td><td><input type="date" value="${esc(d.due_date||'')}" onchange="updateDefect('${d.id}','due_date',this.value)">${od?'<span class="status overdue" style="margin-top:4px">OVERDUE</span>':''}</td><td><select onchange="updateDefect('${d.id}','status',this.value)">${statuses.map(x=>`<option ${d.status===x?'selected':''}>${x}</option>`).join('')}</select>${transitionHint?`<div class="transition-note">${transitionHint}</div>`:''}</td><td><input value="${esc(d.verification_note||'')}" placeholder="Verification / closure note" onchange="updateDefect('${d.id}','verification_note',this.value)"></td><td><button class="secondary smallbtn" onclick="viewInspection('${d.inspection_id}')">Open</button></td></tr>`}).join(''):'<tr><td colspan="10"><div class="empty">No defects match the current filters.</div></td></tr>'}</tbody></table></div><datalist id="responsibleList">${[...new Set(data.map(d=>d.responsible).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div>`}
let defectFilters={q:'',w:'',p:'',s:'',due:''};
async function defects(){nav('nDef');document.getElementById('view').innerHTML='<div class="section">Loading defect register…</div>';try{await Promise.all([loadWarehouses(),loadDefects()]);renderDefectRegister(defectCache,defectFilters)}catch(e){document.getElementById('view').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function applyDefectFilters(){defectFilters={q:document.getElementById('fq').value.trim(),w:document.getElementById('fw').value,p:document.getElementById('fp').value,s:document.getElementById('fs').value,due:document.getElementById('fdue').value};renderDefectRegister(defectCache,defectFilters)}
function clearDefectFilters(){defectFilters={q:'',w:'',p:'',s:'',due:''};renderDefectRegister(defectCache,defectFilters)}
const DEFECT_STATUS_ORDER={Open:0,'In Progress':1,Completed:2,Verified:3,Closed:4};
function canTransition(from,to){if(from===to)return true;if(from==='Open'&&to==='In Progress')return true;if(from==='In Progress'&&to==='Completed')return true;if(from==='Completed'&&to==='Verified')return true;if(from==='Verified'&&to==='Closed')return true;if(from==='Closed'&&to==='Open')return true;return false}
async function updateDefect(id,key,value){const d=defectCache.find(x=>x.id===id);if(!d){toast('Defect not found','err');return}const oldValue=d[key]??null;if(key==='status'){if(!canTransition(d.status,value)){toast(`Invalid status transition: ${d.status} → ${value}. Use Open → In Progress → Completed → Verified → Closed.`,'err');renderDefectRegister(defectCache,defectFilters);return}if(value==='Verified'&&!String(d.verification_note||'').trim()){const note=prompt('Verification note (required):','Verified during follow-up inspection');if(note===null)return;if(!note.trim()){toast('Verification note is required before verification.','err');return}d.verification_note=note.trim()}if(value==='Closed'&&!String(d.verification_note||'').trim()){const note=prompt('Closure note (required):','Issue resolved and verified.');if(note===null)return;if(!note.trim()){toast('Closure note is required before closure.','err');return}d.verification_note=note.trim()}}
const patch={[key]:value||null};if(key==='status'&&value==='Completed')patch.completed_at=new Date().toISOString();if(key==='status'&&value==='Verified')patch.verified_at=new Date().toISOString();if(key==='status'&&value==='Closed'){patch.closed_by=user?.email||null;patch.closed_at=new Date().toISOString()}if(key==='status'&&value!=='Closed'&&d.status==='Closed'){patch.closed_by=null;patch.closed_at=null}if(key==='status'&&value!=='Verified'&&d.status==='Verified')patch.verified_at=null;if((key==='status'&&['Verified','Closed'].includes(value))&&d.verification_note)patch.verification_note=d.verification_note;const r=await sb.from('defects').update(patch).eq('id',id);if(r.error){toast(r.error.message,'err');return}Object.assign(d,patch);await auditLog('UPDATE','defect',id,{warehouse:d.warehouses?.name||'',area:d.area,description:d.description,field:key,from:oldValue,to:value||null,verification_note:d.verification_note||null,summary:key==='status'?`Status changed: ${oldValue||'—'} → ${value}`:`${key} updated`});toast(key==='status'?`Defect moved to ${value}`:'Defect updated','ok');renderDefectRegister(defectCache,defectFilters)}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportDefects(){const rows=defectCache.filter(d=>defectMatches(d,defectFilters));const head=['Date','Warehouse','Area','Description','Priority','Responsible','Due Date','Status','Completed At','Closed By','Verification Note'];const out=[head,...rows.map(d=>[(d.created_at||'').slice(0,10),d.warehouses?.name||'',d.area,d.description,d.priority,d.responsible||'',d.due_date||'',d.status,d.completed_at||'',d.closed_by||'',d.verification_note||''])].map(r=>r.map(csvCell).join(','));const blob=new Blob([out.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`defect-register-${localDate()}.csv`;a.click();URL.revokeObjectURL(a.href)}

function auditValue(v){if(v===null||v===undefined||v==='')return '—';if(typeof v==='object')return JSON.stringify(v);return String(v)}

function startOfWeek(d=new Date()){const x=new Date(d);const day=x.getDay();const diff=(day===0?-6:1-day);x.setDate(x.getDate()+diff);x.setHours(0,0,0,0);return x}
function isoDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function weekLabel(){const s=startOfWeek(),e=new Date(s);e.setDate(e.getDate()+6);return `${isoDate(s)} → ${isoDate(e)}`}

 'Warehouse Configuration':'Настройка складов','Manage active warehouses and names. Changes are shared with all authorized users.':'Управление активными складами и их названиями. Изменения видны всем авторизованным пользователям.','Historical inspections are never deleted when a warehouse is deactivated.':'Исторические проверки не удаляются при деактивации склада.','Active':'Активен','Inactive':'Неактивен','Activate':'Активировать','Deactivate':'Деактивировать','Save Names':'Сохранить названия','Warehouse names saved':'Названия складов сохранены',
 'Interface Language':'Язык интерфейса','Theme':'Тема','Light':'Светлая','Dark':'Тёмная','Appearance':'Внешний вид','Language':'Язык','English':'English','Russian':'Русский','Save Preferences':'Сохранить настройки','Preferences saved':'Настройки сохранены','Professional interface settings':'Профессиональные настройки интерфейса','Choose the language and appearance used on this device.':'Выберите язык и внешний вид интерфейса на этом устройстве.','System status':'Состояние системы','Connected':'Подключено','Cloud database':'Облачная база данных','Photo storage':'Хранилище фотографий','Current user':'Текущий пользователь','Version':'Версия','Professional edition':'Профессиональная версия',

const uiOriginal=new WeakMap();
function currentLang(){return localStorage.getItem('warehouse_lang')||'en'}
function syncDocumentLanguage(){document.documentElement.lang=currentLang()==='ru'?'ru':'en'}
function currentTheme(){return localStorage.getItem('warehouse_theme')||'light'}
function applyTheme(){syncDocumentLanguage();document.documentElement.dataset.theme=currentTheme();const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=currentTheme()==='dark'?'#0b1220':'#102a43'}
function trText(v){if(currentLang()==='en')return v;let out=v;Object.keys(UI_TEXT).sort((a,b)=>b.length-a.length).forEach(k=>{out=out.split(k).join(UI_TEXT[k])});return out}
function translatePage(){const root=document.getElementById('app');if(!root)return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){if(!n.parentElement||['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;if(!uiOriginal.has(n))uiOriginal.set(n,n.nodeValue);n.nodeValue=trText(uiOriginal.get(n))}root.querySelectorAll('input,textarea').forEach(el=>{if(el.dataset.enPlaceholder===undefined)el.dataset.enPlaceholder=el.placeholder||'';if(el.dataset.enPlaceholder)el.placeholder=trText(el.dataset.enPlaceholder)});root.querySelectorAll('option').forEach(el=>{if(el.dataset.enText===undefined)el.dataset.enText=el.textContent;if(el.dataset.enText)el.textContent=trText(el.dataset.enText)})}
function setLanguage(lang){localStorage.setItem('warehouse_lang',lang);syncDocumentLanguage();translatePage();settings()}
function setTheme(theme){localStorage.setItem('warehouse_theme',theme);applyTheme();toast(theme==='dark'?(currentLang()==='ru'?'Тёмная тема включена':'Dark theme enabled'):(currentLang()==='ru'?'Светлая тема включена':'Light theme enabled'),'ok')}
const _renderAuth=renderAuth; renderAuth=function(){_renderAuth();setTimeout(()=>{applyTheme();translatePage()},0)};
function settings(){nav('nSet');const view=document.getElementById('view');view.innerHTML=`<div class="section hero settingsHero"><div><div class="eyebrow">${currentLang()==='ru'?'SYSTEM SETTINGS':'SYSTEM SETTINGS'}</div><h2>${currentLang()==='ru'?'Настройки':'Settings'}</h2><div class="muted">${currentLang()==='ru'?'Управление интерфейсом, складами и параметрами системы.':'Manage the interface, warehouses and system preferences.'}</div></div></div>
<div class="settingsGrid">
<div class="section settingsCard"><div class="settingsTitle"><div class="settingsIcon">🌐</div><div><h3>${currentLang()==='ru'?'Язык интерфейса':'Interface Language'}</h3><div class="muted">${currentLang()==='ru'?'Выберите язык программы.':'Choose the application language.'}</div></div></div><select id="prefLang" onchange="setLanguage(this.value)"><option value="en" ${currentLang()==='en'?'selected':''}>English</option><option value="ru" ${currentLang()==='ru'?'selected':''}>Русский</option></select></div>
<div class="section settingsCard"><div class="settingsTitle"><div class="settingsIcon">◐</div><div><h3>${currentLang()==='ru'?'Внешний вид':'Appearance'}</h3><div class="muted">${currentLang()==='ru'?'Светлая или тёмная тема.':'Light or dark interface theme.'}</div></div></div><div class="themeSwitch"><button class="themeChoice ${currentTheme()==='light'?'selected':''}" onclick="setTheme('light')">☀️ ${currentLang()==='ru'?'Светлая':'Light'}</button><button class="themeChoice ${currentTheme()==='dark'?'selected':''}" onclick="setTheme('dark')">🌙 ${currentLang()==='ru'?'Тёмная':'Dark'}</button></div></div>
<div class="section settingsCard"><div class="settingsTitle"><div class="settingsIcon">☁</div><div><h3>${currentLang()==='ru'?'Состояние системы':'System status'}</h3><div class="muted">${currentLang()==='ru'?'Текущее подключение':'Current connection'}</div></div></div><div class="systemRows"><div><span>${currentLang()==='ru'?'Состояние':'Status'}</span><b class="status ok">${currentLang()==='ru'?'Подключено':'Connected'}</b></div><div><span>${currentLang()==='ru'?'База данных':'Database'}</span><b>${currentLang()==='ru'?'Supabase':'Supabase'}</b></div><div><span>${currentLang()==='ru'?'Пользователь':'User'}</span><b>${esc(user?.email||'')}</b></div></div></div>
</div>
<div class="section"><div class="settingsTitle"><div class="settingsIcon">🏭</div><div><h3>${currentLang()==='ru'?'Склады':'Warehouses'}</h3><div class="muted">${currentLang()==='ru'?'Названия и активность складов.':'Warehouse names and active status.'}</div></div></div><div class="warnbox">${currentLang()==='ru'?'Исторические проверки никогда не удаляются при деактивации склада.':'Historical inspections are never deleted when a warehouse is deactivated.'}</div><div id="whSettings"></div><button class="good" onclick="saveWH()">💾 ${currentLang()==='ru'?'Сохранить названия':'Save Names'}</button></div>`;
loadSettingsWarehouses();translatePage()}
async function loadSettingsWarehouses(){try{const r=await sb.from('warehouses').select('*').order('sort_order');if(r.error)throw r.error;const list=r.data||[];const root=document.getElementById('whSettings');if(!root)return;root.innerHTML=list.map(w=>`<div class="warehouseSetting"><div class="warehouseSettingMain"><div class="warehouseNumber">${String(w.sort_order).padStart(2,'0')}</div><div><label>${currentLang()==='ru'?'Название склада':'Warehouse name'}</label><input id="wn${w.id}" value="${esc(w.name)}"></div></div><div class="warehouseSettingActions"><span class="status ${w.active?'ok':'none'}">${w.active?(currentLang()==='ru'?'Активен':'Active'):(currentLang()==='ru'?'Неактивен':'Inactive')}</span><button class="secondary smallbtn" onclick="toggleWH(${w.id},${w.active})">${w.active?(currentLang()==='ru'?'Деактивировать':'Deactivate'):(currentLang()==='ru'?'Активировать':'Activate')}</button></div></div>`).join('');translatePage()}catch(e){toast(e.message,'err')}}
const _showModal=showModal; showModal=function(title,html){_showModal(title,html);translatePage()};
const _nav=nav; nav=function(id){_nav(id);setTimeout(translatePage,0)};
applyTheme();
// Stable V15: no global MutationObserver. Each navigation/render explicitly refreshes translations.
syncDocumentLanguage();
init();

</script>
