const uiOriginal=new WeakMap();
function currentLang(){return localStorage.getItem('warehouse_lang')||'lv'}
function currentTheme(){return localStorage.getItem('warehouse_theme')||'dark'}
function applyTheme(){document.documentElement.dataset.theme=currentTheme();const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=currentTheme()==='dark'?'#0b1220':'#102a43'}
function trText(v){const lang=currentLang();if(lang==='en')return v;const map=lang==='lv'?LV_TEXT:UI_TEXT;let out=String(v??'');Object.keys(map).sort((a,b)=>b.length-a.length).forEach(k=>{out=out.split(k).join(map[k])});Object.keys(EXTRA_TEXT).sort((a,b)=>b.length-a.length).forEach(k=>{const t=EXTRA_TEXT[k]?.[lang];if(t)out=out.split(k).join(t)});return out}
function translatePage(){const root=document.getElementById('app');if(!root)return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){if(!n.parentElement||['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;if(!uiOriginal.has(n))uiOriginal.set(n,n.nodeValue);n.nodeValue=trText(uiOriginal.get(n))}root.querySelectorAll('input,textarea').forEach(el=>{if(el.dataset.enPlaceholder===undefined)el.dataset.enPlaceholder=el.placeholder||'';if(el.dataset.enPlaceholder)el.placeholder=trText(el.dataset.enPlaceholder)});root.querySelectorAll('option').forEach(el=>{if(el.dataset.stableValue===undefined)el.dataset.stableValue=el.value;if(el.dataset.stableText===undefined)el.dataset.stableText=el.textContent;el.value=el.dataset.stableValue;el.textContent=trText(el.dataset.stableText)})}
function setLanguage(lang){if(!['lv','en','ru'].includes(lang))lang='en';if(lang===currentLang())return;localStorage.setItem('warehouse_lang',lang);location.reload()}
function setTheme(theme){localStorage.setItem('warehouse_theme',theme);applyTheme();toast(trText(theme==='dark'?'Dark theme enabled':'Light theme enabled'),'ok')}
const _renderAuth=renderAuth; renderAuth=function(){_renderAuth();setTimeout(()=>{applyTheme();translatePage()},0)};
function settings(){nav('nSet');const view=document.getElementById('view');view.innerHTML=`<div class="section hero settingsHero"><div><div class="eyebrow">${trText('SYSTEM SETTINGS')}</div><h2>${trText('Settings')}</h2><div class="muted">${trText('Manage the interface, warehouses and system preferences.')}</div></div></div>
<div class="settingsGrid">
<div class="section settingsCard"><div class="settingsTitle"><div class="settingsIcon">🌐</div><div><h3>${trText('Interface Language')}</h3><div class="muted">${trText('Choose the application language.')}</div></div></div><select id="prefLang" onchange="setLanguage(this.value)"><option value="lv" ${currentLang()==='lv'?'selected':''}>Latviešu</option><option value="en" ${currentLang()==='en'?'selected':''}>English</option><option value="ru" ${currentLang()==='ru'?'selected':''}>Русский</option></select></div>
<div class="section settingsCard"><div class="settingsTitle"><div class="settingsIcon">◐</div><div><h3>${trText('Appearance')}</h3><div class="muted">${trText('Light or dark interface theme.')}</div></div></div><div class="themeSwitch"><button class="themeChoice ${currentTheme()==='light'?'selected':''}" onclick="setTheme('light')">☀️ ${trText('Light')}</button><button class="themeChoice ${currentTheme()==='dark'?'selected':''}" onclick="setTheme('dark')">🌙 ${trText('Dark')}</button></div></div>
<div class="section settingsCard"><div class="settingsTitle"><div class="settingsIcon">☁</div><div><h3>${trText('System status')}</h3><div class="muted">${trText('Current connection')}</div></div></div><div class="systemRows"><div><span>${trText('Status')}</span><b class="status ok">${trText('Connected')}</b></div><div><span>${trText('Database')}</span><b>Supabase</b></div><div><span>${trText('User')}</span><b>${esc(user?.email||'')}</b></div></div></div>
</div>
<div class="section"><div class="settingsTitle"><div class="settingsIcon">🏭</div><div><h3>${trText('Warehouses')}</h3><div class="muted">${trText('Warehouse names and active status.')}</div></div></div><div class="warnbox">${trText('Historical inspections are never deleted when a warehouse is deactivated.')}</div><div id="whSettings"></div><button class="good" onclick="saveWH()">💾 ${trText('Save Names')}</button></div>
<div class="section"><div class="settingsTitle"><div class="settingsIcon">👤</div><div><h3>${trText('Responsible Persons')}</h3><div class="muted">${trText('People who can be assigned to repairs.')}</div></div></div><div class="row"><div><label>${trText('Name')}</label><input id="newRespName" placeholder="${trText('Full name')}"></div><div><label>${trText('Email')}</label><input id="newRespEmail" type="email" placeholder="name@example.com"></div></div><button class="good" style="margin-top:10px" onclick="addResponsible()">＋ ${trText('Add Responsible')}</button><div id="responsibleSettings" style="margin-top:12px"></div></div>`;
loadSettingsWarehouses();loadResponsibleSettings();translatePage()}

async function loadSettingsWarehouses(){try{const r=await sb.from('warehouses').select('*').order('sort_order');if(r.error)throw r.error;const list=r.data||[];const root=document.getElementById('whSettings');if(!root)return;root.innerHTML=list.map(w=>`<div class="warehouseSetting"><div class="warehouseSettingMain"><div class="warehouseNumber">${String(w.sort_order).padStart(2,'0')}</div><div><label>${trText('Warehouse name')}</label><input id="wn${w.id}" value="${esc(w.name)}"></div></div><div class="warehouseSettingActions"><span class="status ${w.active?'ok':'none'}">${w.active?trText('Active'):trText('Inactive')}</span><button class="secondary smallbtn" onclick="toggleWH(${w.id},${w.active})">${w.active?trText('Deactivate'):trText('Activate')}</button></div></div>`).join('');translatePage()}catch(e){toast(e.message,'err')}}
async function loadResponsibleSettings(){try{const r=await sb.from('responsible_persons').select('id,name,email,active').order('name');if(r.error)throw r.error;const root=document.getElementById('responsibleSettings');if(!root)return;root.innerHTML=(r.data||[]).map(x=>`<div class="warehouseSetting"><div class="warehouseSettingMain"><div class="warehouseNumber">👤</div><div><label>${esc(x.name)}</label><div class="muted">${esc(x.email)}</div></div></div><div class="warehouseSettingActions"><span class="status ${x.active?'ok':'none'}">${x.active?trText('Active'):trText('Inactive')}</span><button class="secondary smallbtn" onclick="toggleResponsible(${x.id},${x.active})">${x.active?trText('Deactivate'):trText('Activate')}</button></div></div>`).join('')||`<div class="empty">${trText('No responsible persons yet.')}</div>`}catch(e){const root=document.getElementById('responsibleSettings');if(root)root.innerHTML=`<div class="warnbox">${esc(e.message)}</div>`}}
async function addResponsible(){const name=document.getElementById('newRespName')?.value.trim(),email=document.getElementById('newRespEmail')?.value.trim();if(!name||!email){toast(trText('Name and email are required.'),'err');return}const r=await sb.from('responsible_persons').insert({name,email,active:true});if(r.error){toast(r.error.message,'err');return}document.getElementById('newRespName').value='';document.getElementById('newRespEmail').value='';await loadResponsibleSettings();await loadResponsibles();toast(trText('Responsible person added.'),'ok')}
async function toggleResponsible(id,active){const r=await sb.from('responsible_persons').update({active:!active}).eq('id',id);if(r.error){toast(r.error.message,'err');return}await loadResponsibleSettings();await loadResponsibles()}

function v16t(k){return V16[currentLang()]?.[k]||V16.en[k]||k}
let warehousePhotoUrls={};
async function loadWarehousePhotoUrls(list){
  warehousePhotoUrls={};
  const rows=(list||warehouses||[]).filter(w=>w.photo_path);
  for(const w of rows){
    try{
      const r=await sb.storage.from('inspection-photos').createSignedUrl(w.photo_path,86400);
      if(!r.error&&r.data?.signedUrl) warehousePhotoUrls[String(w.id)]=r.data.signedUrl;
    }catch(e){}
  }
  return warehousePhotoUrls;
}
function warehousePhotoMarkup(w, extraClass=''){
  const u=warehousePhotoUrls[String(w.id)];
  return u ? `<img class="warehouse-photo-img ${extraClass}" src="${esc(u)}" alt="${esc(w.name)}" loading="lazy">` : '';
}
async function compressImage(file){
  if(!file||!file.type.startsWith('image/'))return file;
  try{
    const bitmap=await createImageBitmap(file), max=1800;
    const scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));
    const c=document.createElement('canvas');c.width=Math.round(bitmap.width*scale);c.height=Math.round(bitmap.height*scale);
    const ctx=c.getContext('2d');ctx.drawImage(bitmap,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
    return blob?new File([blob],safe(file.name).replace(/\.[^.]+$/i,'.jpg'),{type:'image/jpeg'}):file;
  }catch(e){return file}
}
async function uploadWarehousePhoto(id,inputId){
  const input=document.getElementById(inputId),file=input?.files?.[0];
  if(!file)return;
  if(!file.type.startsWith('image/')){toast(trText('Please select an image'),'err');return;}
  try{
    const row=(warehouses||[]).find(w=>String(w.id)===String(id));if(!row)throw new Error('Warehouse not found');
    const f=await compressImage(file),ext=(f.type||'image/jpeg').split('/')[1]||'jpeg',path=`warehouse-covers/${id}-${Date.now()}.${ext}`;
    const up=await sb.storage.from('inspection-photos').upload(path,f,{upsert:false,contentType:f.type||'image/jpeg'});if(up.error)throw up.error;
    if(row.photo_path){try{await sb.storage.from('inspection-photos').remove([row.photo_path])}catch(e){}}
    const db=await sb.from('warehouses').update({photo_path:path}).eq('id',id);if(db.error){try{await sb.storage.from('inspection-photos').remove([path])}catch(e){};throw db.error}
    row.photo_path=path;await loadWarehousePhotoUrls([row]);toast(trText('Warehouse photo saved'),'ok');settings();
  }catch(e){toast(trText('Warehouse photo upload failed: ')+e.message,'err')}
}
async function removeWarehousePhoto(id){
  try{
    const row=(warehouses||[]).find(w=>String(w.id)===String(id));if(!row)return;
    if(row.photo_path){const r=await sb.storage.from('inspection-photos').remove([row.photo_path]);if(r.error)throw r.error}
    const db=await sb.from('warehouses').update({photo_path:null}).eq('id',id);if(db.error)throw db.error;
    row.photo_path=null;delete warehousePhotoUrls[String(id)];toast(trText('Warehouse photo removed'),'ok');settings();
  }catch(e){toast(trText('Warehouse photo removal failed: ')+e.message,'err')}
}

async function init(){
  const c=configStatus();
  if(!c.urlOK||!c.keyOK){
    showLogin('Please configure config.js with your Supabase URL and publishable key.');
    return;
  }
  sb=createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  try{
    const r=await sb.auth.getSession();
    if(r.error){showLogin(r.error.message);return}
    user=r.data.session?.user||null;
    await loadUserRole();
    renderAuth();
  }catch(e){
    showLogin(e.message);
  }

  // Do not rebuild the SPA when Supabase refreshes the session in a
  // background tab. Only react to an actual sign-out or first sign-in.
  sb.auth.onAuthStateChange((event,s)=>{
    const wasLoggedIn=!!user;
    user=s?.user||null;
    if(event==='SIGNED_OUT'){
      showLogin();
      return;
    }
    if(event==='SIGNED_IN' && !wasLoggedIn){
      renderAuth();
    }
  });
}
async function signIn(){const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;const r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)showLogin(r.error.message)}
async function signUp(){const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;if(p.length<6){showLogin('Password must contain at least 6 characters.');return}const r=await sb.auth.signUp({email:e,password:p});if(r.error)showLogin(r.error.message);else showLogin('Account created. If email confirmation is enabled, confirm the email before signing in.')}
async function signOut(){await sb.auth.signOut()}
function renderAuth(){
  if(!user){showLogin();return}
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userBox').innerHTML=`<select class="lang-select" aria-label="Language" onchange="setLanguage(this.value)"><option value="lv" ${currentLang()==='lv'?'selected':''}>LV</option><option value="en" ${currentLang()==='en'?'selected':''}>EN</option><option value="ru" ${currentLang()==='ru'?'selected':''}>RU</option></select><span>${esc(user.email||'')}</span><button class="secondary" onclick="signOut()">Sign out</button>`;
  const restore=localStorage.getItem('warehouse_current_view')||'nDash';
  v16sync();
  if(restore==='nInspect') selectWarehouse();
  else if(restore==='nDef') defects();
  else if(restore==='nArchive') archive();
  else if(restore==='nWeekly') weekly();
  else if(restore==='nReports') reports();
  else if(restore==='nAudit') audit();
  else if(restore==='nSet') settings();
  else dashboard();
}

async function loadUserRole(){
  userRole='viewer';
  if(!user?.id || !sb) return userRole;
  try{
    const r=await sb.from('user_profiles')
      .select('role,active,full_name,email')
      .eq('user_id',user.id)
      .maybeSingle();
    if(!r.error && r.data){
      userRole=r.data.active===false?'viewer':(r.data.role||'viewer');
      if(r.data.full_name) user.full_name=r.data.full_name;
    }
  }catch(e){}
  const navUsers=document.getElementById('nUsers');
  if(navUsers) navUsers.style.display=(userRole==='admin')?'':'none';
  return userRole;
}
function isAdmin(){return userRole==='admin' && !!user?.id}
async function bootstrapAdmin(){
  if(!user?.id){toast(trText('Authentication required'),'err');return}
  try{
    const r=await sb.rpc('bootstrap_first_admin');
    if(r.error){toast(r.error.message,'err');return}
    await loadUserRole();
    v16sync();
    toast(trText('Administrator activated.'),'ok');
    settings();
  }catch(e){toast(e.message||String(e),'err')}
}

async function loadResponsibles(){const r=await sb.from('responsible_persons').select('id,name,email,active').eq('active',true).order('name');if(r.error){if(/relation|does not exist/i.test(String(r.error.message||''))){responsibles=[];return responsibles}throw r.error}responsibles=r.data||[];return responsibles}
async function loadInspections(){const r=await sb.from('inspections').select('*,warehouses(name),inspection_items(status)').order('created_at',{ascending:false});if(r.error)throw r.error;allInspections=r.data||[];return allInspections}
async function loadDefects(){const r=await sb.from('defects').select('*,warehouses(name)').order('created_at',{ascending:false});if(r.error)throw r.error;defectCache=r.data||[];return defectCache}

async function saveUserProfile(id){

function settings(){v16nav('nSet');const view=document.getElementById('view');view.innerHTML=`<div class="content-head"><div><h2>${v16t('SettingsTitle')}</h2><p>${v16t('ChooseWarehouse')}</p></div></div><div class="settings-layout"><div class="settings-menu"><button class="active">${v16t('Appearance')}</button><button onclick="document.getElementById('warehouseSettings').scrollIntoView({behavior:'smooth'})">${v16t('Warehouses')}</button><button onclick="document.getElementById('responsibleSettings').scrollIntoView({behavior:'smooth'})">${v16t('ResponsiblePersons')}</button>${isAdmin()?`<button onclick="users()">${v16t('Users')}</button>`:``}<button onclick="audit()">${v16t('Audit')}</button></div><div class="settings-main"><div class="setting-card"><h3>${v16t('Appearance')}</h3><p>${v16t('Theme')} · ${v16t('Language')}</p><div class="head-actions"><button class="ghost-btn" onclick="setTheme('light')">☀ ${v16t('Light')}</button><button class="ghost-btn" onclick="setTheme('dark')">◐ ${v16t('Dark')}</button><select onchange="setLanguage(this.value)"><option value="lv" ${currentLang()==='lv'?'selected':''}>Latviešu</option><option value="en" ${currentLang()==='en'?'selected':''}>English</option><option value="ru" ${currentLang()==='ru'?'selected':''}>Русский</option></select></div></div><div class="setting-card" id="warehouseSettings"><h3>${v16t('Warehouses')}</h3><p>${trText('Warehouse names and active status.')} · ${v16t('WarehousePhoto')}</p><div id="whSettings"></div><button class="primary-btn" onclick="saveWH()">${v16t('SaveNames')}</button></div><div class="setting-card" id="responsibleSettings"><h3>${v16t('ResponsiblePersons')}</h3><p>${trText('People who can be assigned to repairs.')}</p><div class="check-fields"><input id="newRespName" placeholder="${trText('Full name')}"><input id="newRespEmail" placeholder="name@example.com"></div><button class="primary-btn" style="margin-top:8px" onclick="addResponsible()">＋ ${v16t('AddResponsible')}</button><div id="responsibleSettingsList" style="margin-top:12px"></div></div>${!isAdmin()?`<div class="setting-card"><h3>${v16t('Administrator')}</h3><p>${v16t('If no administrator exists yet, the first authenticated user can activate administrator access.')}</p><button class="primary-btn" onclick="bootstrapAdmin()">${v16t('Activate Administrator')}</button></div>`:`<div class="setting-card"><h3>${v16t('User Management')}</h3><p>${v16t('Manage system users and roles.')}</p><button class="primary-btn" onclick="users()">${v16t('Open Users')}</button></div>`}<div class="setting-card"><h3>${v16t('System')}</h3><p>${v16t('Connected')} · Supabase · ${esc(user?.email||'')}</p></div></div></div>`;loadSettingsWarehousesV16();loadResponsibleSettingsV16();v16sync()}

async function weekly(){v16nav('nWeekly');const view=document.getElementById('view');view.innerHTML='<div class="section">Loading…</div>';try{await Promise.all([loadWarehouses(),loadInspections(),loadDefects()]);const s=startOfWeek(),e=new Date(s);e.setDate(e.getDate()+6);const inWeek=allInspections.filter(i=>{const d=new Date(i.inspection_date+'T12:00:00');return d>=s&&d<=e}),done=new Set(inWeek.map(i=>String(i.warehouse_id)));view.innerHTML=`<div class="content-head"><div><h2>${v16t('WeeklyControl')}</h2><p>${weekLabel()}</p></div><button class="ghost-btn" onclick="exportWeekly()">CSV</button></div><div class="section hero"><div class="progress"><i style="width:${warehouses.length?Math.round(done.size/warehouses.length*100):0}%"></i></div><p>${done.size}/${warehouses.length} ${v16t('Inspected').toLowerCase()}</p></div><div class="section" style="margin-top:14px"><div class="warehouse-list">${warehouses.map(w=>{const i=inWeek.find(x=>String(x.warehouse_id)===String(w.id));return `<div class="warehouse-row" onclick="${i?`viewInspection('${i.id}')`:`startInspection(${w.id})`}"><div class="wh-num">${String(w.sort_order).padStart(2,'0')}</div><div class="wh-info"><b>${esc(w.name)}</b><small>${i?esc(i.inspection_date):v16t('NotInspected')}</small></div><span class="status-pill ${i?'status-ok':'status-attn'}">${i?v16t('NoIssues'):v16t('Attention')}</span></div>`}).join('')}</div></div>`;v16sync()}catch(e){view.innerHTML=`<div class="section error">${esc(e.message)}</div>`}}
