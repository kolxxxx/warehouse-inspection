<script>
// Remove old service workers/caches from previous broken versions once.
(async()=>{try{if(!sessionStorage.getItem('v15_cleanup')){sessionStorage.setItem('v15_cleanup','1');const regs=await navigator.serviceWorker?.getRegistrations?.()||[];await Promise.all(regs.map(r=>r.unregister()));if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}location.reload();}}catch(e){}})();
</script>

<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom);transition:background .2s,color .2s}header{background:linear-gradient(135deg,#102a43,#173b61);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:20}.head{max-width:1280px;margin:auto;display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{display:flex;gap:10px;align-items:center}.brand h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.8;margin-top:3px}.userbox{font-size:12px;display:flex;align-items:center;gap:8px}.userbox button{padding:8px 12px}.container{max-width:1280px;margin:auto;padding:14px}.nav{display:flex;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:14px;overflow:auto;box-shadow:var(--shadow)}.nav button{white-space:nowrap;flex:1;background:transparent;color:var(--muted);border:1px solid transparent}.nav button.active{background:var(--nav);color:#fff}button{border:0;border-radius:9px;padding:10px 14px;background:var(--nav);color:#fff;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.08)}button:disabled{opacity:.55;cursor:not-allowed}button.secondary{background:#dfe9f2;color:#102a43}html[data-theme="dark"] button.secondary{background:#24364b;color:#f1f5f9}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.section,.card,.kpi,.report-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.section{margin-bottom:13px}.hero{padding:20px}.hero h2{margin:0 0 6px;font-size:24px}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:13px 0}.kpi span{font-size:12px;color:var(--muted)}.kpi b{font-size:26px;display:block;margin-top:5px}.kpi .hint{font-size:11px;color:var(--muted);margin-top:4px}.progress{height:8px;background:var(--panel2);border-radius:8px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--green);border-radius:8px}.status{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800;white-space:nowrap}.ok{background:#dff5e7;color:#176b35}.attention{background:#fff0c7;color:#7b5200}.critical,.overdue{background:#ffe0df;color:#9d2721}.none{background:#e7edf2;color:#586a78}.inprogress{background:#dbeafe;color:#20518a}.completed{background:#dcf4e7;color:#216c48}.verified{background:#e9e3fb;color:#5b43a5}html[data-theme="dark"] .ok{background:#123d28;color:#86efac}html[data-theme="dark"] .attention{background:#4a3610;color:#fde68a}html[data-theme="dark"] .critical,html[data-theme="dark"] .overdue{background:#4a2025;color:#fda4af}html[data-theme="dark"] .none{background:#263646;color:#c4d0dc}html[data-theme="dark"] .inprogress{background:#183657;color:#93c5fd}html[data-theme="dark"] .completed{background:#153a2b;color:#86efac}html[data-theme="dark"] .verified{background:#31275a;color:#c4b5fd}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-weight:700;font-size:13px;display:block;margin:10px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:14px;color:var(--text)}input::placeholder,textarea::placeholder{color:var(--muted)}input:focus,select:focus,textarea:focus{outline:2px solid #60a5fa;border-color:#60a5fa}.whgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.wh{background:var(--panel2);color:var(--text);border:1px solid var(--line);text-align:left;min-height:76px}.wh small{display:block;margin-top:5px;color:var(--muted)}.item{border:1px solid var(--line);border-radius:12px;padding:13px;margin:9px 0;background:var(--panel2)}.item.attn{border-left:4px solid #d68a00}.item.crit{border-left:4px solid #c0392b}.itemtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.itemtitle{font-weight:800}.photo-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.photo-thumb{width:110px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}.readonly,.note,.mini{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:10px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;vertical-align:middle}th{background:var(--panel2);position:sticky;top:0;z-index:1}.overdue-row{background:rgba(180,47,37,.08)}.closed-row{opacity:.72}.nowrap{white-space:nowrap}.desc{max-width:280px;white-space:normal}.filterbar{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:8px;margin:12px 0}.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.mini b{font-size:20px;display:block;margin-top:2px}.history-actions{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:28px;text-align:center;color:var(--muted)}.error{background:#fee5e2;color:#9f2b22;padding:11px;border-radius:8px;margin:10px 0;font-size:13px}.success{background:#e7f6eb;color:#196b35;padding:11px;border-radius:8px;margin:10px 0;font-size:13px}.warnbox{background:#fff7df;color:#775200;padding:11px;border-radius:8px;margin:10px 0;font-size:13px}html[data-theme="dark"] .error{background:#4a2025;color:#fecaca}html[data-theme="dark"] .success{background:#123d28;color:#bbf7d0}html[data-theme="dark"] .warnbox{background:#49380f;color:#fde68a}.hidden{display:none}.smallbtn{padding:8px 10px;font-size:12px}.diag{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.diagrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.pass{color:var(--green);font-weight:700}.fail{color:var(--red);font-weight:700}.modalback{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}.modal{background:var(--panel);color:var(--text);border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:18px;box-shadow:0 20px 70px rgba(0,0,0,.35)}.modalhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.toast{position:fixed;right:18px;bottom:18px;z-index:70;background:var(--nav);color:#fff;padding:12px 15px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:360px}.toast.ok{background:#1f6f3a;color:#fff}.toast.err{background:#a52c22;color:#fff}.report-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.settingsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.settingsTitle{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}.settingsIcon{width:42px;height:42px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:20px;flex:0 0 42px}.themeSwitch{display:grid;grid-template-columns:1fr 1fr;gap:8px}.themeChoice{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.themeChoice.selected{background:var(--nav);color:#fff;border-color:var(--nav)}.systemRows>div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.warehouseSetting{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:12px 0;border-bottom:1px solid var(--line)}.warehouseSettingMain{display:flex;align-items:center;gap:12px;flex:1}.warehouseNumber{font-weight:800;color:var(--muted);width:32px}.warehouseSettingActions{display:flex;align-items:center;gap:8px}.eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:800;color:var(--blue);margin-bottom:5px}
