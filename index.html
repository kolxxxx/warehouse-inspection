<body>
<header class="topbar"><div class="topbar-inner"><div class="mobile-brand"><span class="brand-mark">🏭</span><span><b>Warehouse Inspection</b><small>15 warehouses</small></span></div><div id="userBox" class="userbox"></div></div></header>
<div class="app-shell">
<aside class="sidebar" id="sideNav">
  <div class="side-brand"><div class="brand-mark">🏭</div><div><b>Warehouse<br>Inspection</b><small>Terminal control</small></div></div>
  <div class="side-lang"><span>Language</span><div class="lang-pills"><button onclick="setLanguage('lv')">LV</button><button onclick="setLanguage('en')">EN</button><button onclick="setLanguage('ru')">RU</button></div></div>
  <nav class="side-nav">
    <button id="nDash" onclick="dashboard()"><span>⌂</span><span data-nav-label="Dashboard">Dashboard</span></button>
    <button id="nInspect" onclick="selectWarehouse()"><span>✓</span><span data-nav-label="Inspections">Inspections</span></button>
    <button id="nDef" onclick="defects()"><span>△</span><span data-nav-label="Defects">Defects</span></button>
    <button id="nWeekly" onclick="weekly()"><span>▣</span><span data-nav-label="Weekly Control">Weekly Control</span></button>
    <button id="nReports" onclick="reports()"><span>▤</span><span data-nav-label="Reports">Reports</span></button>
    <button id="nSet" onclick="settings()"><span>⚙</span><span data-nav-label="Settings">Settings</span></button>
  </nav>
  <button class="side-audit" id="nAudit" onclick="audit()"><span>◌</span><span data-nav-label="Audit">Audit</span></button>
  <div class="side-footer"><button class="theme-mini" onclick="setTheme(currentTheme()==='dark'?'light':'dark')"><span>◐</span><span id="themeLabel">Theme</span></button></div>
</aside>
<main class="main-content">
<div id="login" class="section hidden"></div>
<div id="app" class="hidden"><div id="view"></div></div>
</main></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>

const {createClient}=supabase;
let sb=null,user=null,warehouses=[],allInspections=[],defectCache=[],responsibles=[];
const BASE_AREAS=[['Roof','Leaks, surface damage, drainage'],['Walls & Facade','Cracks, damage, cladding'],['Floor','Potholes, cracks, surface damage'],['Gates & Doors','Operation, locks, hinges, sealing'],['Windows','Glass, frames, sealing'],['Electrical','Lights, panels, cables, sockets'],['Lighting','Internal and external lighting'],['Fire Safety','Fire extinguishers, exits, signs, access'],['Ventilation','Ventilation, grilles, equipment'],['Housekeeping & Order','Waste, access routes, storage'],['Surrounding Area','Roads, drainage, fencing, vegetation']];
function areasFor(id){return Number(id)<=8?[...BASE_AREAS,['Tent Condition','Tears, damage, tension, fixings, frame, leaks']]:BASE_AREAS}
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function safe(s){return String(s||'file').replace(/[^a-zA-Z0-9._-]/g,'_').slice(-90)}
function cls(s){return s==='Critical'?'critical':s==='Attention'?'attention':s==='OK'?'ok':s==='In Progress'?'inprogress':s==='Completed'?'completed':s==='Verified'?'verified':s==='OVERDUE'?'overdue':'none'}
function getOverallStatus(ins){const items=Array.isArray(ins?.inspection_items)?ins.inspection_items:[];if(items.some(x=>x?.status==='Critical'))return 'Critical';if(items.some(x=>x?.status==='Attention'))return 'Attention';return items.length?'OK':'Not Inspected'}
function isOverdue(d){return !!d && d<localDate()}
function toast(msg,type=''){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast ${type}">${esc(msg)}</div>`;setTimeout(()=>r.innerHTML='',3500)}
function showModal(title,html){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2 style="margin:0">${esc(title)}</h2><button class="secondary" onclick="closeModal()">Close</button></div>${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function nav(id){['nDash','nInspect','nDef','nWeekly','nReports','nAudit','nSet'].forEach(x=>{const el=document.getElementById(x);if(el)el.classList.remove('active')});const el=document.getElementById(id);if(el)el.classList.add('active')}
function normalizeSupabaseUrl(raw){try{let u=new URL(String(raw||'').trim());u.pathname='';u.search='';u.hash='';return u.toString().replace(/\/$/,'')}catch(e){return ''}}
function configStatus(){const url=normalizeSupabaseUrl(window.SUPABASE_URL);const key=String(window.SUPABASE_KEY||'').trim();return{url,key,urlOK:/^https:\/\/[^\s]+\.supabase\.co$/i.test(url),keyOK:key.length>20&&!key.includes('YOUR_')}}
function showLogin(msg=''){document.getElementById('app').classList.add('hidden');const el=document.getElementById('login');el.classList.remove('hidden');el.innerHTML=`<h2 style="margin-top:0">${trText('Warehouse Inspection')}</h2><p class="muted">${trText('Secure shared inspection system for terminal warehouses.')}</p>${msg?`<div class="error">${esc(msg)}</div>`:''}<label>${trText('Email')}</label><input id="email" type="email" placeholder="name@company.com"><label>${trText('Password')}</label><input id="pass" type="password" placeholder="Password"><div class="toolbar" style="margin-top:14px"><button onclick="signIn()">${trText('Sign In')}</button><button class="secondary" onclick="signUp()">${trText('Create Account')}</button><button class="secondary smallbtn" onclick="testConnection()">${trText('Test Connection')}</button></div><div id="diagnostics"></div>`}
async function testConnection(){const box=document.getElementById('diagnostics');if(!box)return;const c=configStatus();box.innerHTML=`<div class="diag"><b>Connection diagnostics</b><div class="diagrow"><span>Supabase URL</span><span class="${c.urlOK?'pass':'fail'}">${c.urlOK?'OK':'ERROR'}</span></div><div class="diagrow"><span>Publishable key</span><span class="${c.keyOK?'pass':'fail'}">${c.keyOK?'OK':'ERROR'}</span></div></div>`;if(!c.urlOK||!c.keyOK)return;const client=sb||createClient(c.url,c.key);let authOK=false,dbOK=false,storageOK=false,details=[];try{const r=await client.auth.getSession();authOK=!r.error;if(r.error)details.push('Authentication: '+r.error.message)}catch(e){details.push('Authentication: '+e.message)}try{const r=await client.from('warehouses').select('id').limit(1);dbOK=!r.error;if(r.error)details.push('Database: '+r.error.message)}catch(e){details.push('Database: '+e.message)}try{const r=await client.storage.from('inspection-photos').list('',{limit:1});storageOK=!r.error;if(r.error)details.push('Storage: '+r.error.message)}catch(e){details.push('Storage: '+e.message)}box.innerHTML+=`<div class="diag"><div class="diagrow"><span>Authentication</span><span class="${authOK?'pass':'fail'}">${authOK?'OK':'ERROR'}</span></div><div class="diagrow"><span>Database</span><span class="${dbOK?'pass':'fail'}">${dbOK?'OK':'ERROR'}</span></div><div class="diagrow"><span>Photo Storage</span><span class="${storageOK?'pass':'fail'}">${storageOK?'OK':'ERROR'}</span></div></div>${details.length?`<div class="error">${details.map(esc).join('<br>')}</div>`:'<div class="success"><b>Connection test passed.</b></div>'}`}
async function init(){const c=configStatus();if(!c.urlOK||!c.keyOK){showLogin('Please configure config.js with your Supabase URL and publishable key.');return}sb=createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});try{const r=await sb.auth.getSession();if(r.error){showLogin(r.error.message);return}user=r.data.session?.user||null;renderAuth()}catch(e){showLogin(e.message)}sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;renderAuth()})}
async function signIn(){const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;const r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)showLogin(r.error.message)}
async function signUp(){const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;if(p.length<6){showLogin('Password must contain at least 6 characters.');return}const r=await sb.auth.signUp({email:e,password:p});if(r.error)showLogin(r.error.message);else showLogin('Account created. If email confirmation is enabled, confirm the email before signing in.')}
async function signOut(){await sb.auth.signOut()}
function renderAuth(){if(!user){showLogin();return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userBox').innerHTML=`<select class="lang-select" aria-label="Language" onchange="setLanguage(this.value)"><option value="lv" ${currentLang()==='lv'?'selected':''}>LV</option><option value="en" ${currentLang()==='en'?'selected':''}>EN</option><option value="ru" ${currentLang()==='ru'?'selected':''}>RU</option></select><span>${esc(user.email||'')}</span><button class="secondary" onclick="signOut()">Sign out</button>`;dashboard()}
async function loadWarehouses(){const r=await sb.from('warehouses').select('*').eq('active',true).order('sort_order');if(r.error)throw r.error;warehouses=r.data||[];return warehouses}
async function loadResponsibles(){const r=await sb.from('responsible_persons').select('id,name,email,active').eq('active',true).order('name');if(r.error){if(/relation|does not exist/i.test(String(r.error.message||''))){responsibles=[];return responsibles}throw r.error}responsibles=r.data||[];return responsibles}
async function loadInspections(){const r=await sb.from('inspections').select('*,warehouses(name),inspection_items(status)').order('created_at',{ascending:false});if(r.error)throw r.error;allInspections=r.data||[];return allInspections}
async function loadDefects(){const r=await sb.from('defects').select('*,warehouses(name)').order('created_at',{ascending:false});if(r.error)throw r.error;defectCache=r.data||[];return defectCache}
function lastByWarehouse(ins){const m={};for(const i of ins){if(!m[i.warehouse_id])m[i.warehouse_id]=i}return m}
function openDefects(defs){return defs.filter(d=>d.status!=='Closed')}
function dashboard(){nav('nDash');loadDashboard()}
async function loadDashboard(){const view=document.getElementById('view');view.innerHTML='<div class="section">Loading dashboard…</div>';try{await Promise.all([loadWarehouses(),loadInspections(),loadDefects()]);const last=lastByWarehouse(allInspections),active=warehouses.length,inspected=warehouses.filter(w=>last[w.id]).length,open=openDefects(defectCache),critical=open.filter(d=>d.priority==='Critical').length,overdue=open.filter(d=>isOverdue(d.due_date)).length,ok=warehouses.filter(w=>last[w.id]&&getOverallStatus(last[w.id])==='OK').length,coverage=active?Math.round(inspected/active*100):0;view.innerHTML=`<div class="section hero"><h2>Inspection Dashboard</h2><div class="muted">Shared data from all devices. All inspection records are retained in the database.</div><div class="progress"><i style="width:${coverage}%"></i></div><div class="muted">Inspection coverage: ${coverage}% · ${inspected} of ${active} active warehouses inspected</div></div><div class="kpis"><div class="kpi"><span>Inspected</span><b>${inspected}/${active}</b><div class="hint">Active warehouses</div></div><div class="kpi"><span>No Issues</span><b>${ok}</b><div class="hint">Latest status OK</div></div><div class="kpi"><span>Critical Open</span><b>${critical}</b><div class="hint">Needs priority action</div></div><div class="kpi"><span>Overdue</span><b>${overdue}</b><div class="hint">Open past due date</div></div><div class="kpi"><span>Total Inspections</span><b>${allInspections.length}</b><div class="hint">All historical records</div></div></div><div class="section"><div class="toolbar" style="justify-content:space-between"><div><h3 style="margin:0">Warehouses</h3><div class="muted">Open the latest inspection, review history, or start a new inspection.</div></div><button class="secondary" onclick="defects()">Open Defect Register</button></div></div><div class="grid">${warehouses.map(w=>{const i=last[w.id],s=i?getOverallStatus(i):'Not Inspected',hist=allInspections.filter(x=>x.warehouse_id===w.id).length;return `<div class="card"><h3 style="margin-top:0">${esc(w.name)}</h3><span class="status ${cls(s)}">${esc(s)}</span><p class="muted">${i?`Last inspection: ${esc(i.inspection_date)}`:'No inspection yet'}</p><div class="history-actions">${i?`<button onclick="viewInspection('${i.id}')">Open Last Inspection</button><button class="secondary" onclick="startInspection(${w.id})">Start New Inspection</button>`:`<button onclick="startInspection(${w.id})">Start Inspection</button>`}${hist?`<button class="secondary" onclick="showHistory(${w.id})">View Inspection History (${hist})</button>`:''}</div></div>`}).join('')}</div><div id="historyPanel"></div>`}catch(e){view.innerHTML=`<div class="error">Dashboard could not be loaded: ${esc(e.message)}</div>`}translatePage()}
async function showHistory(wid){try{const name=(warehouses.find(w=>String(w.id)===String(wid))||{}).name||'Warehouse';const rows=allInspections.filter(i=>String(i.warehouse_id)===String(wid));showModal(`${name} — Inspection History`,`<div class="muted">${rows.length} historical inspection record(s) retained</div><div class="tablewrap" style="margin-top:12px"><table style="min-width:700px"><thead><tr><th>Date</th><th>Status</th><th>Inspector</th><th>Issues</th><th>Action</th></tr></thead><tbody>${rows.map(i=>{const st=getOverallStatus(i),items=i.inspection_items||[],issues=items.filter(x=>x.status==='Attention'||x.status==='Critical').length;return `<tr><td class="nowrap">${esc(i.inspection_date||'')}</td><td><span class="status ${cls(st)}">${st}</span></td><td>${esc(i.inspector||'')}</td><td>${issues}</td><td><button onclick="closeModal();viewInspection('${i.id}')">Open</button></td></tr>`}).join('')}</tbody></table></div>`)}catch(e){toast(e.message,'err')}}
async function selectWarehouse(){nav('nInspect');try{await Promise.all([loadWarehouses(),loadInspections()]);const last=lastByWarehouse(allInspections);document.getElementById('view').innerHTML=`<div class="section"><h2>Select Warehouse</h2><div class="muted">Choose a warehouse to inspect or review its latest record.</div><div class="whgrid" style="margin-top:12px">${warehouses.map(w=>{const i=last[w.id],s=i?getOverallStatus(i):'Not Inspected';return `<div><button class="wh" onclick="${i?`viewInspection('${i.id}')`:`startInspection(${w.id})`}"><strong>${esc(w.name)}</strong><small>${i?`Last: ${esc(i.inspection_date)} · ${esc(s)}`:'No inspection yet'}</small></button>${i?`<button class="secondary" style="width:100%;margin-top:5px" onclick="startInspection(${w.id})">New Inspection</button>`:''}</div>`}).join('')}</div></div>`}catch(e){document.getElementById('view').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function startInspection(wid){nav('nInspect');const w=warehouses.find(x=>String(x.id)===String(wid));if(!w){toast('Warehouse not found','err');return}try{await loadResponsibles()}catch(e){toast(e.message,'err');responsibles=[]}const arr=areasFor(wid);const respOptions=`<option value="">— ${trText('Select responsible')} —</option>${responsibles.map(r=>`<option value="${r.id}">${esc(r.name)} · ${esc(r.email)}</option>`).join('')}`;document.getElementById('view').innerHTML=`<div class="section"><button class="secondary" onclick="selectWarehouse()">← Back</button><div class="toolbar" style="justify-content:space-between;margin-top:10px"><div><h2 style="margin:0">New Inspection — ${esc(w.name)}</h2><div class="muted">Complete every checkpoint. Use Attention/Critical when action is required.</div></div><span class="status none">Draft · not saved</span></div><div class="row"><div><label>Date</label><input id="date" type="date" value="${localDate()}"></div><div><label>Inspector</label><input id="inspector" value="${esc(user?.email||'')}"></div></div></div><div class="section"><h3 style="margin-top:0">Inspection Checklist</h3>${arr.map((a,n)=>`<div class="item" id="item${n}"><div class="itemtop"><div><div class="itemtitle">${n+1}. ${esc(a[0])}</div><div class="muted">${esc(a[1])}</div></div><select id="st${n}" onchange="highlightItem(${n})"><option value="OK">OK</option><option value="Attention">Attention</option><option value="Critical">Critical</option><option value="N/A">N/A</option></select></div><label>Comment / Finding</label><textarea id="fd${n}" placeholder="Describe the condition or finding…"></textarea><div class="responsible-box"><label>Responsible for repair</label><select id="resp${n}">${respOptions}</select><div class="muted">Select the person responsible if corrective action is required.</div></div><label>Photos</label><input id="ph${n}" type="file" accept="image/*,.heic,.heif" capture="environment" multiple><div class="muted photo-hint">Photos are automatically converted to JPEG for reliable viewing on all devices.</div></div>`).join('')}<label>Overall Comment</label><textarea id="overallComment" placeholder="Optional summary of the inspection…"></textarea><div class="toolbar" style="margin-top:12px"><button class="good" id="saveBtn" onclick="saveInspection(${wid})">💾 Save Inspection</button><button class="secondary" onclick="selectWarehouse()">Cancel</button></div></div>`;translatePage()}
function highlightItem(n){const el=document.getElementById('item'+n),st=document.getElementById('st'+n).value;el.classList.toggle('attn',st==='Attention');el.classList.toggle('crit',st==='Critical')}
async function compressImage(file){if(!file||!file.type.startsWith('image/'))return file;try{const bitmap=await createImageBitmap(file);const max=1800;const scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));const c=document.createElement('canvas');c.width=Math.round(bitmap.width*scale);c.height=Math.round(bitmap.height*scale);const ctx=c.getContext('2d');ctx.drawImage(bitmap,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return blob?new File([blob],safe(file.name).replace(/\.[^.]+$/i,'.jpg'),{type:'image/jpeg'}):file}catch(e){return file}}
async function saveInspection(wid){const btn=document.getElementById('saveBtn');if(!btn||btn.disabled)return;if(btn.disabled)return;btn.disabled=true;btn.textContent=trText('Saving…');const arr=areasFor(wid);const inspector=document.getElementById('inspector').value.trim();const date=document.getElementById('date').value;const language=currentLang();if(!inspector||!date){toast(trText('Inspector and date are required.'),'err');btn.disabled=false;btn.textContent='💾 '+trText('Save Inspection');return}let createdId=null,warnings=[];try{const r=await sb.from('inspections').insert({warehouse_id:wid,inspector,inspection_date:date,overall_comment:document.getElementById('overallComment').value.trim(),language}).select().single();if(r.error)throw r.error;createdId=r.data.id;const itemRows=[];for(let n=0;n<arr.length;n++){const rawStatus=document.getElementById('st'+n).value;
const st=({'OK':'OK','Attention':'Attention','Critical':'Critical','N/A':'N/A','Внимание':'Attention','Критический':'Critical','Хорошо':'OK','Н/Д':'N/A','Uzmanība':'Attention','Kritisks':'Critical','Labi':'OK','N/P':'N/A'})[rawStatus]||rawStatus,f=document.getElementById('fd'+n).value.trim(),rid=document.getElementById('resp'+n)?.value||null,resp=responsibles.find(x=>String(x.id)===String(rid));itemRows.push({inspection_id:createdId,area:arr[n][0],status:st,finding:f,responsible_id:rid,responsible_name:resp?.name||null,responsible_email:resp?.email||null})}const ir=await sb.from('inspection_items').insert(itemRows);if(ir.error)throw ir.error;const defectRows=[];for(let n=0;n<arr.length;n++){const rawStatus=document.getElementById('st'+n).value;
const st=({'OK':'OK','Attention':'Attention','Critical':'Critical','N/A':'N/A','Внимание':'Attention','Критический':'Critical','Хорошо':'OK','Н/Д':'N/A','Uzmanība':'Attention','Kritisks':'Critical','Labi':'OK','N/P':'N/A'})[rawStatus]||rawStatus,f=document.getElementById('fd'+n).value.trim(),rid=document.getElementById('resp'+n)?.value||null,resp=responsibles.find(x=>String(x.id)===String(rid));if((st==='Attention'||st==='Critical'))defectRows.push({inspection_id:createdId,warehouse_id:wid,area:arr[n][0],description:f||'Inspection finding',priority:st,status:'Open',responsible:resp?.name||null,responsible_email:resp?.email||null})}if(defectRows.length){const dr=await sb.from('defects').insert(defectRows).select('id,area,priority,description,responsible,responsible_email');if(dr.error)warnings.push(trText('Defect register update failed: ')+dr.error.message);else for(const d of dr.data||[]) await auditLog('CREATE','defect',d.id,{warehouse_id:wid,warehouse:(warehouses.find(w=>String(w.id)===String(wid))||{}).name||'',area:d.area,priority:d.priority,description:d.description,status:'Open',responsible:d.responsible||null,responsible_email:d.responsible_email||null})}for(let n=0;n<arr.length;n++){const input=document.getElementById('ph'+n),files=input?.files?Array.from(input.files):[];for(const original of files){try{const f=await compressImage(original);const path=`${createdId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safe(f.name)}`;const up=await sb.storage.from('inspection-photos').upload(path,f,{upsert:false,contentType:f.type||'image/jpeg'});if(up.error){warnings.push(`${trText('Photo upload failed for')} ${arr[n][0]}`);continue}const pr=await sb.from('inspection_photos').insert({inspection_id:createdId,area:arr[n][0],storage_path:path});if(pr.error)warnings.push(`${trText('Photo record failed for')} ${arr[n][0]}`)}catch(e){warnings.push(`${trText('Photo processing failed for')} ${arr[n][0]}`)}}}await auditLog('CREATE','inspection',createdId,{warehouse_id:wid,inspection_date:date,warning_count:warnings.length,language});try{const nr=await sb.functions.invoke('notify-responsibles',{body:{inspection_id:createdId}});if(nr.error)warnings.push(trText('Email notification failed: ')+nr.error.message)}catch(e){warnings.push(trText('Email notification failed: ')+e.message)}toast(warnings.length?`${trText('Inspection saved with')} ${warnings.length} ${trText('warning(s).')}`:trText('Inspection saved successfully.'),'ok');await loadInspections();await loadDefects();dashboard()}catch(e){if(createdId)await sb.from('inspections').delete().eq('id',createdId);toast(trText('Inspection was not saved: ')+e.message,'err');btn.disabled=false;btn.textContent='💾 '+trText('Save Inspection')}}
async function viewInspection(id){nav('nInspect');document.getElementById('view').innerHTML='<div class="section">Loading inspection…</div>';try{const ir=await sb.from('inspections').select('*,warehouses(name)').eq('id',id).single();if(ir.error)throw ir.error;const [itp,php]=await Promise.all([sb.from('inspection_items').select('*').eq('inspection_id',id).order('created_at'),sb.from('inspection_photos').select('*').eq('inspection_id',id).order('created_at')]);if(itp.error)throw itp.error;if(php.error)throw php.error;const photoMap={};for(const ph of php.data||[]){const sr=await sb.storage.from('inspection-photos').createSignedUrl(ph.storage_path,3600);if(!photoMap[ph.area])photoMap[ph.area]=[];if(!sr.error)photoMap[ph.area].push(sr.data.signedUrl)}const items=itp.data||[],st=getOverallStatus({inspection_items:items});document.getElementById('view').innerHTML=`<div class="section"><div class="toolbar"><button class="secondary" onclick="dashboard()">← Dashboard</button><button class="secondary" onclick="showHistory(${ir.data.warehouse_id})">Inspection History</button></div><div class="toolbar" style="justify-content:space-between;margin-top:12px"><div><h2 style="margin:0">Inspection — ${esc(ir.data.warehouses?.name||'')}</h2><div class="muted">${esc(ir.data.inspection_date||'')} · ${esc(ir.data.inspector||'')}</div></div><span class="status ${cls(st)}">${esc(st)}</span></div>${ir.data.overall_comment?`<div class="note"><b>Overall Comment</b><div>${esc(ir.data.overall_comment)}</div></div>`:''}</div><div class="section"><h3 style="margin-top:0">Inspection Checklist</h3>${items.map((it,n)=>`<div class="item ${it.status==='Critical'?'crit':it.status==='Attention'?'attn':''}"><div class="itemtop"><div class="itemtitle">${n+1}. ${esc(it.area)}</div><span class="status ${cls(it.status)}">${esc(it.status)}</span></div><label>Comment / Finding</label><div class="readonly">${it.finding?esc(it.finding):'No finding recorded.'}</div>${(photoMap[it.area]||[]).length?`<label>Photos</label><div class="photo-grid">${photoMap[it.area].map(u=>`<a href="${u}" target="_blank" rel="noopener"><img class="photo-thumb" src="${u}" alt="Inspection photo"></a>`).join('')}</div>`:''}</div>`).join('')}</div><div class="section"><button class="good" onclick="startInspection(${ir.data.warehouse_id})">＋ Start New Inspection</button></div>`}catch(e){document.getElementById('view').innerHTML=`<div class="error">Could not open inspection: ${esc(e.message)}</div>`}}
function defectPriorityClass(p){return p==='Critical'?'critical':'attention'}
function defectMatches(d,filters){const q=filters.q.toLowerCase();const txt=[d.warehouses?.name,d.area,d.description,d.responsible].join(' ').toLowerCase();return(!q||txt.includes(q))&&(!filters.w||String(d.warehouse_id)===filters.w)&&(!filters.p||d.priority===filters.p)&&(!filters.s||d.status===filters.s)&&(!filters.due||(filters.due==='overdue'?(isOverdue(d.due_date)&&d.status!=='Closed'):filters.due==='nodue'&&!d.due_date))}
function renderDefectRegister(data,filters){
  const view=document.getElementById('view');
  if(!view)return;
  if(!Array.isArray(data))data=[];
  if(!filters)filters={q:'',w:'',p:'',s:'',due:''};
  const open=data.filter(d=>d.status!=='Closed');
  const overdue=open.filter(d=>isOverdue(d.due_date));
  const critical=open.filter(d=>d.priority==='Critical');
  const completed=data.filter(d=>d.status==='Completed');
  const verified=data.filter(d=>d.status==='Verified');
  const closed=data.filter(d=>d.status==='Closed');
  const warehousesOptions=warehouses.map(w=>`<option value="${w.id}" ${filters.w===String(w.id)?'selected':''}>${esc(w.name)}</option>`).join('');
  const filtered=data.filter(d=>defectMatches(d,filters));
  const statuses=['Open','In Progress','Completed','Verified','Closed'];
  const statusOptions=(current)=>statuses.map(x=>`<option value="${esc(x)}" ${current===x?'selected':''}>${esc(trText(x))}</option>`).join('');
  const priorityOptions=`<option value="Attention" ${filters.p==='Attention'?'selected':''}>${esc(trText('Attention'))}</option><option value="Critical" ${filters.p==='Critical'?'selected':''}>${esc(trText('Critical'))}</option>`;
  const rows=filtered.length?filtered.map(d=>{
    const od=isOverdue(d.due_date)&&!['Closed','Verified'].includes(d.status);
    const transitionHint=d.status==='Completed'?trText('Awaiting verification'):d.status==='Verified'?trText('Ready for closure'):'';
    return `<tr class="${od?'overdue-row':''} ${d.status==='Closed'?'closed-row':''}">
      <td class="nowrap">${esc((d.created_at||'').slice(0,10))}</td>
      <td>${esc(d.warehouses?.name||'')}</td>
      <td>${esc(d.area||'')}</td>
      <td class="desc">${esc(d.description||'')}</td>
      <td><span class="status ${defectPriorityClass(d.priority)}">${esc(trText(d.priority||''))}</span></td>
      <td><input value="${esc(d.responsible||'')}" list="responsibleList" onchange="updateDefect('${d.id}','responsible',this.value)"></td>
      <td><input type="date" value="${esc(d.due_date||'')}" onchange="updateDefect('${d.id}','due_date',this.value)">${od?`<span class="status overdue" style="margin-top:4px">${esc(trText('OVERDUE'))}</span>`:''}</td>
      <td><select onchange="updateDefect('${d.id}','status',this.value)">${statusOptions(d.status)}</select>${transitionHint?`<div class="transition-note">${esc(transitionHint)}</div>`:''}</td>
      <td><input value="${esc(d.verification_note||'')}" placeholder="${esc(trText('Verification / closure note'))}" onchange="updateDefect('${d.id}','verification_note',this.value)"></td>
      <td><button class="secondary smallbtn" onclick="viewInspection('${d.inspection_id}')">${esc(trText('Open'))}</button></td>
    </tr>`;
  }).join(''):`<tr><td colspan="10"><div class="empty">${esc(trText('No defects match the current filters.'))}</div></td></tr>`;
  view.innerHTML=`
    <div class="section hero">
      <div class="toolbar" style="justify-content:space-between">
        <div><h2 style="margin:0">${esc(trText('Defect Register'))}</h2><div class="muted">${esc(trText('Lifecycle: Open → In Progress → Completed → Verified → Closed. Closed defects can be reopened as Open.'))}</div></div>
        <div class="toolbar"><button class="secondary" onclick="exportDefects()">${esc(trText('Export CSV'))}</button><button onclick="dashboard()">${esc(trText('Dashboard'))}</button></div>
      </div>
    </div>
    <div class="summary-strip">
      <div class="mini"><span class="muted">${esc(trText('Open'))}</span><b>${open.length}</b></div>
      <div class="mini"><span class="muted">${esc(trText('Overdue'))}</span><b>${overdue.length}</b></div>
      <div class="mini"><span class="muted">${esc(trText('Critical Open'))}</span><b>${critical.length}</b></div>
      <div class="mini"><span class="muted">${esc(trText('Completed'))}</span><b>${completed.length}</b></div>
      <div class="mini"><span class="muted">${esc(trText('Verified'))}</span><b>${verified.length}</b></div>
      <div class="mini"><span class="muted">${esc(trText('Closed'))}</span><b>${closed.length}</b></div>
    </div>
    <div class="section">
      <div class="filterbar">
        <input id="fq" placeholder="${esc(trText('Search warehouse, area, description, responsible…'))}" value="${esc(filters.q)}">
        <select id="fw"><option value="">${esc(trText('All warehouses'))}</option>${warehousesOptions}</select>
        <select id="fp"><option value="">${esc(trText('All priorities'))}</option>${priorityOptions}</select>
        <select id="fs"><option value="">${esc(trText('All statuses'))}</option>${statuses.map(x=>`<option value="${esc(x)}" ${filters.s===x?'selected':''}>${esc(trText(x))}</option>`).join('')}</select>
        <select id="fdue"><option value="">${esc(trText('All due dates'))}</option><option value="overdue" ${filters.due==='overdue'?'selected':''}>${esc(trText('Overdue'))}</option><option value="nodue" ${filters.due==='nodue'?'selected':''}>${esc(trText('No due date'))}</option></select>
        <button class="secondary" onclick="applyDefectFilters()">${esc(trText('Filter'))}</button>
      </div>
      <div class="toolbar" style="margin-bottom:10px"><button class="link" onclick="clearDefectFilters()">${esc(trText('Clear filters'))}</button><span class="muted">${esc(trText('Showing'))} ${filtered.length} ${esc(trText('of'))} ${data.length} ${esc(trText('defects'))}</span></div>
      <div class="tablewrap"><table style="min-width:1250px"><thead><tr>
        <th>${esc(trText('Date'))}</th><th>${esc(trText('Warehouse'))}</th><th>${esc(trText('Area'))}</th><th>${esc(trText('Description'))}</th><th>${esc(trText('Priority'))}</th><th>${esc(trText('Responsible'))}</th><th>${esc(trText('Due Date'))}</th><th>${esc(trText('Status'))}</th><th>${esc(trText('Verification Note'))}</th><th>${esc(trText('Inspection'))}</th>
      </tr></thead><tbody>${rows}</tbody></table></div>
      <datalist id="responsibleList">${[...new Set(data.map(d=>d.responsible).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
    </div>`;
}

function defects(){
  nav('nDef');
  const view=document.getElementById('view');
  if(!view)return;
  view.innerHTML=`<div class="section"><span class="muted">${esc(trText('Loading defect register…'))}</span></div>`;
  const render=()=>{
    try{
      renderDefectRegister(defectCache,defectFilters);
      return true;
    }catch(e){
      view.innerHTML=`<div class="section error"><h3>${esc(trText('Defect Register could not be loaded'))}</h3><p>${esc(e?.message||e)}</p><button class="secondary" onclick="defects()">${esc(trText('Retry'))}</button></div>`;
      return false;
    }
  };
  // Render immediately from the already loaded dashboard cache. Never block the UI on a second request.
  if(warehouses.length && defectCache.length){render();return;}
  Promise.all([
    warehouses.length?Promise.resolve(warehouses):loadWarehouses(),
    defectCache.length?Promise.resolve(defectCache):loadDefects()
  ]).then(()=>render()).catch(e=>{
    view.innerHTML=`<div class="section error"><h3>${esc(trText('Defect Register could not be loaded'))}</h3><p>${esc(e?.message||e)}</p><button class="secondary" onclick="defects()">${esc(trText('Retry'))}</button></div>`;
  });
}
let defectFilters={q:'',w:'',p:'',s:'',due:''};
function applyDefectFilters(){defectFilters={q:document.getElementById('fq').value.trim(),w:document.getElementById('fw').value,p:document.getElementById('fp').value,s:document.getElementById('fs').value,due:document.getElementById('fdue').value};renderDefectRegister(defectCache,defectFilters)}
function clearDefectFilters(){defectFilters={q:'',w:'',p:'',s:'',due:''};renderDefectRegister(defectCache,defectFilters)}
const DEFECT_STATUS_ORDER={Open:0,'In Progress':1,Completed:2,Verified:3,Closed:4};
function canTransition(from,to){if(from===to)return true;if(from==='Open'&&to==='In Progress')return true;if(from==='In Progress'&&to==='Completed')return true;if(from==='Completed'&&to==='Verified')return true;if(from==='Verified'&&to==='Closed')return true;if(from==='Closed'&&to==='Open')return true;return false}
async function updateDefect(id,key,value){const d=defectCache.find(x=>x.id===id);if(!d){toast('Defect not found','err');return}const oldValue=d[key]??null;if(key==='status'){if(!canTransition(d.status,value)){toast(`Invalid status transition: ${d.status} → ${value}. Use Open → In Progress → Completed → Verified → Closed.`,'err');renderDefectRegister(defectCache,defectFilters);return}if(value==='Verified'&&!String(d.verification_note||'').trim()){const note=prompt('Verification note (required):','Verified during follow-up inspection');if(note===null)return;if(!note.trim()){toast('Verification note is required before verification.','err');return}d.verification_note=note.trim()}if(value==='Closed'&&!String(d.verification_note||'').trim()){const note=prompt('Closure note (required):','Issue resolved and verified.');if(note===null)return;if(!note.trim()){toast('Closure note is required before closure.','err');return}d.verification_note=note.trim()}}

function printWeeklyReport(){const s=startOfWeek(),e=new Date(s);e.setDate(e.getDate()+6),inWeek=allInspections.filter(i=>{const d=new Date(i.inspection_date+'T12:00:00');return d>=s&&d<=e});const rows=warehouses.map(w=>{const i=inWeek.find(x=>String(x.warehouse_id)===String(w.id)),defs=defectCache.filter(d=>String(d.warehouse_id)===String(w.id)&&d.status!=='Closed');return `<tr><td>${esc(w.name)}</td><td>${i?'Completed':'Remaining'}</td><td>${i?.inspection_date||'—'}</td><td>${i?esc(getOverallStatus(i)):'—'}</td><td>${defs.length}</td></tr>`}).join('');reportWindow('Weekly Warehouse Report',`<div class="k"><span>Week</span><b>${weekLabel()}</b></div><div class="k"><span>Completed</span><b>${inWeek.length}</b></div><div class="k"><span>Active</span><b>${warehouses.length}</b></div><table><tr><th>Warehouse</th><th>Status</th><th>Date</th><th>Result</th><th>Open Defects</th></tr>${rows}</table>`)}
function printDefectReport(){const open=defectCache.filter(d=>d.status!=='Closed'),rows=open.map(d=>`<tr class="${isOverdue(d.due_date)?'critical':''}"><td>${esc(d.warehouses?.name||'')}</td><td>${esc(d.area)}</td><td>${esc(d.description)}</td><td>${esc(d.priority)}</td><td>${esc(d.responsible||'—')}</td><td>${esc(d.due_date||'—')}</td><td>${esc(d.status)}</td></tr>`).join('');reportWindow('Open Defects Report',`<div class="k"><span>Open</span><b>${open.length}</b></div><div class="k"><span>Overdue</span><b>${open.filter(d=>isOverdue(d.due_date)).length}</b></div><div class="k"><span>Critical</span><b>${open.filter(d=>d.priority==='Critical').length}</b></div><table><tr><th>Warehouse</th><th>Area</th><th>Description</th><th>Priority</th><th>Responsible</th><th>Due</th><th>Status</th></tr>${rows||'<tr><td colspan="7">No open defects.</td></tr>'}</table>`)}
function printWarehouseReport(){const wid=document.getElementById('reportWarehouse').value,w=warehouses.find(x=>String(x.id)===String(wid)),rows=allInspections.filter(i=>String(i.warehouse_id)===String(wid)).map(i=>`<tr><td>${esc(i.inspection_date)}</td><td>${esc(i.inspector||'')}</td><td>${esc(getOverallStatus(i))}</td><td>${esc(i.overall_comment||'')}</td></tr>`).join('');reportWindow(`${w?.name||'Warehouse'} — Inspection History`,`<div class="k"><span>Total inspections</span><b>${allInspections.filter(i=>String(i.warehouse_id)===String(wid)).length}</b></div><table><tr><th>Date</th><th>Inspector</th><th>Result</th><th>Overall comment</th></tr>${rows}</table>`)}
function printMonthlyReport(){const now=new Date(),m=now.getMonth(),y=now.getFullYear(),ins=allInspections.filter(i=>{const d=new Date(i.inspection_date+'T12:00:00');return d.getMonth()===m&&d.getFullYear()===y}),open=defectCache.filter(d=>d.status!=='Closed'),rows=ins.map(i=>`<tr><td>${esc(i.inspection_date)}</td><td>${esc(i.warehouses?.name||'')}</td><td>${esc(i.inspector||'')}</td><td>${esc(getOverallStatus(i))}</td></tr>`).join('');reportWindow(`Monthly Facility Summary — ${y}-${String(m+1).padStart(2,'0')}`,`<div class="k"><span>Inspections this month</span><b>${ins.length}</b></div><div class="k"><span>Open defects</span><b>${open.length}</b></div><table><tr><th>Date</th><th>Warehouse</th><th>Inspector</th><th>Result</th></tr>${rows||'<tr><td colspan="4">No inspections this month.</td></tr>'}</table>`)}
async function audit(){nav('nAudit');const view=document.getElementById('view');try{const r=await sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(250);if(r.error){view.innerHTML=`<div class="section hero"><h2>Audit Log</h2><div class="warnbox">The audit table is not installed yet. Run <b>schema_professional_upgrade.sql</b> in Supabase SQL Editor to enable this module.</div><button onclick="dashboard()">Back to Dashboard</button></div>`;return}const data=r.data||[];view.innerHTML=`<div class="section hero"><div class="toolbar" style="justify-content:space-between"><div><h2>Audit Log</h2><div class="muted">A human-readable history of who changed what and when.</div></div><button class="secondary" onclick="audit()">Refresh</button></div></div><div class="tablewrap"><table style="min-width:950px"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>What changed</th></tr></thead><tbody>${data.length?data.map(x=>`<tr><td class="nowrap">${esc(new Date(x.created_at).toLocaleString())}</td><td>${esc(x.user_email||'')}</td><td><span class="status ${x.action==='UPDATE'?'inprogress':x.action==='CREATE'?'completed':'none'}">${esc(x.action||'')}</span></td><td>${esc(x.entity||'')}</td><td>${auditSummary(x)}</td></tr>`).join(''):'<tr><td colspan="5">No audit records.</td></tr>'}</tbody></table></div>`}catch(e){view.innerHTML=`<div class="error">${esc(e.message)}</div>`}}

const uiOriginal=new WeakMap();
function currentLang(){return localStorage.getItem('warehouse_lang')||'lv'}
function currentTheme(){return localStorage.getItem('warehouse_theme')||'light'}
function applyTheme(){document.documentElement.dataset.theme=currentTheme();const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=currentTheme()==='dark'?'#0b1220':'#102a43'}
function trText(v){const lang=currentLang();if(lang==='en')return v;const map=lang==='lv'?LV_TEXT:UI_TEXT;let out=String(v??'');Object.keys(map).sort((a,b)=>b.length-a.length).forEach(k=>{out=out.split(k).join(map[k])});Object.keys(EXTRA_TEXT).sort((a,b)=>b.length-a.length).forEach(k=>{const t=EXTRA_TEXT[k]?.[lang];if(t)out=out.split(k).join(t)});return out}
function translatePage(){const root=document.getElementById('app');if(!root)return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){if(!n.parentElement||['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;if(!uiOriginal.has(n))uiOriginal.set(n,n.nodeValue);n.nodeValue=trText(uiOriginal.get(n))}root.querySelectorAll('input,textarea').forEach(el=>{if(el.dataset.enPlaceholder===undefined)el.dataset.enPlaceholder=el.placeholder||'';if(el.dataset.enPlaceholder)el.placeholder=trText(el.dataset.enPlaceholder)});root.querySelectorAll('option').forEach(el=>{if(el.dataset.stableValue===undefined)el.dataset.stableValue=el.value;if(el.dataset.stableText===undefined)el.dataset.stableText=el.textContent;el.value=el.dataset.stableValue;el.textContent=trText(el.dataset.stableText)})}
function setLanguage(lang){if(!['lv','en','ru'].includes(lang))lang='en';if(lang===currentLang())return;localStorage.setItem('warehouse_lang',lang);location.reload()}

async function loadSettingsWarehouses(){try{const r=await sb.from('warehouses').select('*').order('sort_order');if(r.error)throw r.error;const list=r.data||[];const root=document.getElementById('whSettings');if(!root)return;root.innerHTML=list.map(w=>`<div class="warehouseSetting"><div class="warehouseSettingMain"><div class="warehouseNumber">${String(w.sort_order).padStart(2,'0')}</div><div><label>${trText('Warehouse name')}</label><input id="wn${w.id}" value="${esc(w.name)}"></div></div><div class="warehouseSettingActions"><span class="status ${w.active?'ok':'none'}">${w.active?trText('Active'):trText('Inactive')}</span><button class="secondary smallbtn" onclick="toggleWH(${w.id},${w.active})">${w.active?trText('Deactivate'):trText('Activate')}</button></div></div>`).join('');translatePage()}catch(e){toast(e.message,'err')}}
async function loadResponsibleSettings(){try{const r=await sb.from('responsible_persons').select('id,name,email,active').order('name');if(r.error)throw r.error;const root=document.getElementById('responsibleSettings');if(!root)return;root.innerHTML=(r.data||[]).map(x=>`<div class="warehouseSetting"><div class="warehouseSettingMain"><div class="warehouseNumber">👤</div><div><label>${esc(x.name)}</label><div class="muted">${esc(x.email)}</div></div></div><div class="warehouseSettingActions"><span class="status ${x.active?'ok':'none'}">${x.active?trText('Active'):trText('Inactive')}</span><button class="secondary smallbtn" onclick="toggleResponsible(${x.id},${x.active})">${x.active?trText('Deactivate'):trText('Activate')}</button></div></div>`).join('')||`<div class="empty">${trText('No responsible persons yet.')}</div>`}catch(e){const root=document.getElementById('responsibleSettings');if(root)root.innerHTML=`<div class="warnbox">${esc(e.message)}</div>`}}
async function addResponsible(){const name=document.getElementById('newRespName')?.value.trim(),email=document.getElementById('newRespEmail')?.value.trim();if(!name||!email){toast(trText('Name and email are required.'),'err');return}const r=await sb.from('responsible_persons').insert({name,email,active:true});if(r.error){toast(r.error.message,'err');return}document.getElementById('newRespName').value='';document.getElementById('newRespEmail').value='';await loadResponsibleSettings();await loadResponsibles();toast(trText('Responsible person added.'),'ok')}
async function toggleResponsible(id,active){const r=await sb.from('responsible_persons').update({active:!active}).eq('id',id);if(r.error){toast(r.error.message,'err');return}await loadResponsibleSettings();await loadResponsibles()}

async function loadDashboardV16(){const view=document.getElementById('view');view.innerHTML=`<div class="section">Loading…</div>`;try{await Promise.all([loadWarehouses(),loadInspections(),loadDefects()]);const last=lastByWarehouse(allInspections),open=openDefects(defectCache),critical=open.filter(d=>d.priority==='Critical').length,attn=open.filter(d=>d.priority==='Attention').length,inspected=warehouses.filter(w=>last[w.id]).length,pct=warehouses.length?Math.round(inspected/warehouses.length*100):0;const rows=warehouses.map(w=>{const i=last[w.id],st=i?getOverallStatus(i):'Not Inspected';return `<div class="warehouse-row" onclick="${i?`viewInspection('${i.id}')`:`startInspection(${w.id})`}"><div class="wh-num">${String(w.sort_order).padStart(2,'0')}</div><div class="wh-info"><b>${esc(w.name)}</b><small>${i?v16t('Last')+': '+esc(i.inspection_date):v16t('NotInspected')}</small></div><span class="status-pill ${v16cls(st)}">${esc(v16status(st))}</span></div>`}).join('');const recent=allInspections.slice(0,5).map(i=>`<div class="warehouse-row" onclick="viewInspection('${i.id}')"><div class="wh-num">✓</div><div class="wh-info"><b>${esc(i.warehouses?.name||'Warehouse')}</b><small>${esc(i.inspection_date||'')} · ${esc(i.inspector||'')}</small></div><span class="status-pill ${v16cls(getOverallStatus(i))}">${esc(v16status(getOverallStatus(i)))}</span></div>`).join('')||`<div class="empty-state">${v16t('NoInspections')}</div>`;const defs=open.slice(0,5).map(d=>`<div class="defect-card ${d.priority==='Critical'?'critical':'attention'}"><div class="defect-top"><h3>${esc(d.area||'Defect')}</h3><span class="status-pill ${v16cls(d.priority)}">${esc(v16status(d.priority))}</span></div><div class="defect-meta">${esc(d.warehouses?.name||'')} · ${esc(d.due_date||'—')}</div><p class="defect-desc">${esc(d.description||'')}</p></div>`).join('')||`<div class="empty-state">${v16t('NoDefects')}</div>`;view.innerHTML=`<div class="content-head"><div><h2>${v16t('Overview')}</h2><p>${v16t('Coverage')}: <b>${pct}%</b> · ${inspected}/${warehouses.length} ${v16t('Warehouses').toLowerCase()}</p></div><div class="head-actions"><button class="primary-btn" onclick="selectWarehouse()">＋ ${v16t('Start')}</button></div></div><div class="kpis"><div class="kpi"><span>${v16t('Total')} ${v16t('Warehouses').toLowerCase()}</span><b>${warehouses.length}</b><div class="hint">${v16t('Active')}</div></div><div class="kpi"><span>${v16t('Inspected')}</span><b>${inspected}</b><div class="hint">${v16t('ThisWeek')}</div></div><div class="kpi"><span>${v16t('OpenDefects')}</span><b>${open.length}</b><div class="hint">${attn} ${v16t('Attention')}</div></div><div class="kpi"><span>${v16t('Critical')}</span><b>${critical}</b><div class="hint">${v16t('Overdue')}: ${open.filter(d=>isOverdue(d.due_date)).length}</div></div></div><div class="section hero"><div class="content-head"><div><h3>${v16t('Warehouses')}</h3><p>${v16t('ChooseWarehouse')}</p></div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="warehouse-list">${rows}</div></div><div class="section" style="margin-top:14px"><div class="content-head"><div><h3>${v16t('RecentInspections')}</h3></div></div><div class="warehouse-list">${recent}</div></div><div class="section" style="margin-top:14px"><div class="content-head"><div><h3>${v16t('RecentDefects')}</h3></div><button class="ghost-btn" onclick="defects()">${v16t('OpenDefects')}</button></div><div class="defect-cards">${defs}</div></div>`;v16sync()}catch(e){view.innerHTML=`<div class="section error">${esc(e.message)}</div>`}}
async function selectWarehouse(){v16nav('nInspect');const view=document.getElementById('view');view.innerHTML='<div class="section">Loading…</div>';try{await Promise.all([loadWarehouses(),loadInspections()]);const last=lastByWarehouse(allInspections);const rows=warehouses.map(w=>{const i=last[w.id],st=i?getOverallStatus(i):'Not Inspected';return `<div class="warehouse-row" onclick="${i?`viewInspection('${i.id}')`:`startInspection(${w.id})`}"><div class="wh-num">${String(w.sort_order).padStart(2,'0')}</div><div class="wh-info"><b>${esc(w.name)}</b><small>${i?v16t('Last')+': '+esc(i.inspection_date):v16t('NotInspected')}</small></div><span class="status-pill ${v16cls(st)}">${esc(v16status(st))}</span></div>`}).join('');view.innerHTML=`<div class="content-head"><div><h2>${v16t('Inspections')}</h2><p>${v16t('ChooseWarehouse')}</p></div></div><div class="section"><div class="warehouse-list">${rows}</div></div>`;v16sync()}catch(e){view.innerHTML=`<div class="section error">${esc(e.message)}</div>`}}
async function startInspection(wid){v16nav('nInspect');const w=warehouses.find(x=>String(x.id)===String(wid));if(!w){toast('Warehouse not found','err');return}try{await loadResponsibles()}catch(e){responsibles=[]}const arr=areasFor(wid);const respOptions=`<option value="">— ${v16t('Responsible')} —</option>${responsibles.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}`;const zones=arr.map((a,n)=>`<div class="zone-card" onclick="document.getElementById('fd${n}')?.focus()"><b>${esc(v16area(a[0]))}</b><small>${n+1}/${arr.length}</small></div>`).join('');const items=arr.map((a,n)=>`<div class="check-item" id="item${n}"><div class="check-top"><div><div class="check-title">${n+1}. ${esc(v16area(a[0]))}</div><div class="check-desc">${esc(v16areaDesc(a[1]))}</div></div><select id="st${n}" onchange="highlightItem(${n})"><option value="OK">${esc(v16t('NoIssues'))}</option><option value="Attention">${esc(v16t('Attention'))}</option><option value="Critical">${esc(v16t('Critical'))}</option><option value="N/A">N/A</option></select></div><div class="check-fields"><div><label>${v16t('Comment')}</label><textarea id="fd${n}" placeholder="${esc(v16t('Comment'))}"></textarea></div><div><label>${v16t('Responsible')}</label><select id="resp${n}">${respOptions}</select><label style="margin-top:8px">${v16t('Photos')}</label><input class="photo-input" id="ph${n}" type="file" accept="image/*,.heic,.heif" capture="environment" multiple></div></div></div>`).join('');view.innerHTML=`<div class="stepper"><div class="step active"><span class="circle">1</span>${v16t('ChooseWarehouse')}</div><div class="step-line"></div><div class="step active"><span class="circle">2</span>${v16t('Checklist')}</div><div class="step-line"></div><div class="step"><span class="circle">3</span>${v16t('Photos')}</div><div class="step-line"></div><div class="step"><span class="circle">4</span>${v16t('Save')}</div></div><div class="inspection-shell"><aside class="inspection-sidebar"><h3>${v16t('Warehouses')}</h3>${warehouses.map(x=>`<div class="warehouse-row ${String(x.id)===String(wid)?'selected':''}" onclick="startInspection(${x.id})"><div class="wh-num">${String(x.sort_order).padStart(2,'0')}</div><div class="wh-info"><b>${esc(x.name)}</b><small>${String(x.id)===String(wid)?v16t('Inspection'):''}</small></div></div>`).join('')}</aside><section class="inspection-center"><div class="warehouse-hero"><div class="warehouse-main"><h2>${esc(w.name)}</h2><p>${v16t('Steps')}</p><div class="zone-grid">${zones}</div></div><div class="warehouse-main"><h3>${v16t('ZoneStatus')}</h3><p>${arr.length} ${v16t('Total').toLowerCase()}</p><div style="margin-top:12px;display:grid;gap:7px">${arr.map((a,n)=>`<div style="display:flex;justify-content:space-between;gap:8px;font-size:11px"><span>${esc(v16area(a[0]))}</span><span id="zs${n}" class="status-pill status-none">—</span></div>`).join('')}</div></div></div><div class="check-head"><h3>${v16t('Checklist')}</h3><span class="status-pill status-none">${v16t('NewInspection')}</span></div>${items}<div class="savebar"><button class="ghost-btn" onclick="selectWarehouse()">${v16t('Back')}</button><div><label style="display:inline-block;margin-right:8px">${v16t('Overall')}</label><input id="overallComment" placeholder="${esc(v16t('Overall'))}" style="min-width:280px"></div><button class="primary-btn" id="saveBtn" onclick="saveInspection(${wid})">${v16t('Save')}</button></div></section></div>`;v16sync()}
function v16area(a){const m={Roof:'Roof','Walls & Facade':'Walls','Floor':'Floor','Gates & Doors':'Gates','Windows':'Other','Electrical':'Other','Lighting':'Other','Fire Safety':'Other','Ventilation':'Vent','Housekeeping & Order':'Other','Surrounding Area':'Territory','Tent Condition':'Tent'};return v16t(m[a]||'Other')}

async function viewInspection(id){v16nav('nInspect');const view=document.getElementById('view');view.innerHTML='<div class="section">Loading…</div>';try{const ir=await sb.from('inspections').select('*,warehouses(name)').eq('id',id).single();if(ir.error)throw ir.error;const [itp,php]=await Promise.all([sb.from('inspection_items').select('*').eq('inspection_id',id).order('created_at'),sb.from('inspection_photos').select('*').eq('inspection_id',id).order('created_at')]);if(itp.error)throw itp.error;if(php.error)throw php.error;const photoMap={};for(const ph of php.data||[]){const sr=await sb.storage.from('inspection-photos').createSignedUrl(ph.storage_path,3600);if(!photoMap[ph.area])photoMap[ph.area]=[];if(!sr.error)photoMap[ph.area].push(sr.data.signedUrl)}const items=itp.data||[],st=getOverallStatus({inspection_items:items});const itemHtml=items.map((it,n)=>`<div class="check-item ${it.status==='Critical'?'crit':it.status==='Attention'?'attn':''}"><div class="check-top"><div><div class="check-title">${n+1}. ${esc(v16area(it.area))}</div><div class="check-desc">${esc(it.area)}</div></div><span class="status-pill ${v16cls(it.status)}">${esc(v16status(it.status))}</span></div>${it.finding?`<p class="defect-desc">${esc(it.finding)}</p>`:''}${(photoMap[it.area]||[]).length?`<div class="photo-grid">${photoMap[it.area].map(u=>`<a href="${u}" target="_blank"><img class="photo-thumb" src="${u}"></a>`).join('')}</div>`:''}${it.responsible_name?`<div class="defect-meta">${esc(v16t('Responsible'))}: ${esc(it.responsible_name)}</div>`:''}</div>`).join('');view.innerHTML=`<div class="content-head"><div><h2>${v16t('Inspection')}: ${esc(ir.data.warehouses?.name||'')}</h2><p>${esc(ir.data.inspection_date||'')} · ${esc(ir.data.inspector||'')}</p></div><span class="status-pill ${v16cls(st)}">${esc(v16status(st))}</span></div><div class="section"><div class="stepper"><div class="step active"><span class="circle">✓</span>${v16t('Inspection')}</div><div class="step-line"></div><div class="step active"><span class="circle">✓</span>${v16t('Photos')}</div><div class="step-line"></div><div class="step active"><span class="circle">✓</span>${v16t('Save')}</div></div>${ir.data.overall_comment?`<div class="warehouse-main" style="margin-bottom:12px"><b>${v16t('Overall')}</b><p>${esc(ir.data.overall_comment)}</p></div>`:''}${itemHtml}<div class="savebar"><button class="ghost-btn" onclick="selectWarehouse()">${v16t('Back')}</button><button class="primary-btn" onclick="startInspection(${ir.data.warehouse_id})">＋ ${v16t('Start')}</button></div></div>`;v16sync()}catch(e){view.innerHTML=`<div class="section error">${esc(e.message)}</div>`}}
function renderDefectRegister(data,filters){const view=document.getElementById('view');if(!view)return;data=Array.isArray(data)?data:[];filters=filters||defectFilters;const open=data.filter(d=>d.status!=='Closed'),overdue=open.filter(d=>isOverdue(d.due_date)),critical=open.filter(d=>d.priority==='Critical');const filtered=data.filter(d=>defectMatches(d,filters));const cards=filtered.map(d=>`<article class="defect-card ${d.priority==='Critical'?'critical':'attention'}"><div class="defect-top"><div><h3>${esc(d.warehouses?.name||'')} · ${esc(v16area(d.area||'Other'))}</h3><div class="defect-meta">${esc((d.created_at||'').slice(0,10))} · ${esc(d.area||'')}</div></div><span class="status-pill ${v16cls(d.priority)}">${esc(v16status(d.priority))}</span></div><p class="defect-desc">${esc(d.description||'')}</p><div class="defect-fields"><div><label>${v16t('Responsible')}</label><input value="${esc(d.responsible||'')}" onchange="updateDefect('${d.id}','responsible',this.value)"></div><div><label>${v16t('Due')}</label><input type="date" value="${esc(d.due_date||'')}" onchange="updateDefect('${d.id}','due_date',this.value)"></div><div><label>${v16t('Status')}</label><select onchange="updateDefect('${d.id}','status',this.value)">${['Open','In Progress','Completed','Verified','Closed'].map(x=>`<option value="${x}" ${d.status===x?'selected':''}>${esc(trText(x))}</option>`).join('')}</select></div></div></article>`).join('')||`<div class="empty-state">${v16t('NoDefects')}</div>`;view.innerHTML=`<div class="content-head"><div><h2>${v16t('DefectRegister')}</h2><p>${v16t('OpenDefects')}: ${open.length} · ${v16t('Critical')}: ${critical.length} · ${v16t('Overdue')}: ${overdue.length}</p></div><div class="head-actions"><button class="ghost-btn" onclick="exportDefects()">CSV</button></div></div><div class="compact-kpis"><div class="compact-kpi"><span>${v16t('OpenDefects')}</span><b>${open.length}</b></div><div class="compact-kpi"><span>${v16t('Critical')}</span><b>${critical.length}</b></div><div class="compact-kpi"><span>${v16t('Overdue')}</span><b>${overdue.length}</b></div><div class="compact-kpi"><span>${v16t('Status')}</span><b>${data.filter(d=>d.status==='Completed').length}</b></div><div class="compact-kpi"><span>${v16t('Total')}</span><b>${data.length}</b></div></div><div class="section"><div class="filter-row"><input id="fq" placeholder="${esc(v16t('Search'))}" value="${esc(filters.q)}"><select id="fw"><option value="">${v16t('AllWarehouses')}</option>${warehouses.map(w=>`<option value="${w.id}" ${filters.w===String(w.id)?'selected':''}>${esc(w.name)}</option>`).join('')}</select><select id="fp"><option value="">${v16t('AllPriorities')}</option><option value="Attention" ${filters.p==='Attention'?'selected':''}>${v16t('Attention')}</option><option value="Critical" ${filters.p==='Critical'?'selected':''}>${v16t('Critical')}</option></select><select id="fs"><option value="">${v16t('AllStatuses')}</option>${['Open','In Progress','Completed','Verified','Closed'].map(x=>`<option value="${x}" ${filters.s===x?'selected':''}>${esc(trText(x))}</option>`).join('')}</select><button class="primary-btn" onclick="applyDefectFilters()">${v16t('Search')}</button></div><div class="defect-cards">${cards}</div></div>`;v16sync()}
function defects(){v16nav('nDef');if(!warehouses.length||!defectCache.length){const view=document.getElementById('view');view.innerHTML=`<div class="section">Loading…</div>`;Promise.all([warehouses.length?Promise.resolve():loadWarehouses(),defectCache.length?Promise.resolve():loadDefects()]).then(()=>renderDefectRegister(defectCache,defectFilters)).catch(e=>{view.innerHTML=`<div class="section error">${esc(e.message)}</div>`})}else renderDefectRegister(defectCache,defectFilters)}

async function weekly(){v16nav('nWeekly');const view=document.getElementById('view');view.innerHTML='<div class="section">Loading…</div>';try{await Promise.all([loadWarehouses(),loadInspections(),loadDefects()]);const s=startOfWeek(),e=new Date(s);e.setDate(e.getDate()+6);const inWeek=allInspections.filter(i=>{const d=new Date(i.inspection_date+'T12:00:00');return d>=s&&d<=e}),done=new Set(inWeek.map(i=>String(i.warehouse_id)));view.innerHTML=`<div class="content-head"><div><h2>${v16t('WeeklyControl')}</h2><p>${weekLabel()}</p></div><button class="ghost-btn" onclick="exportWeekly()">CSV</button></div><div class="section hero"><div class="progress"><i style="width:${warehouses.length?Math.round(done.size/warehouses.length*100):0}%"></i></div><p>${done.size}/${warehouses.length} ${v16t('Inspected').toLowerCase()}</p></div><div class="section" style="margin-top:14px"><div class="warehouse-list">${warehouses.map(w=>{const i=inWeek.find(x=>String(x.warehouse_id)===String(w.id));return `<div class="warehouse-row" onclick="${i?`viewInspection('${i.id}')`:`startInspection(${w.id})`}"><div class="wh-num">${String(w.sort_order).padStart(2,'0')}</div><div class="wh-info"><b>${esc(w.name)}</b><small>${i?esc(i.inspection_date):v16t('NotInspected')}</small></div><span class="status-pill ${i?'status-ok':'status-attn'}">${i?v16t('NoIssues'):v16t('Attention')}</span></div>`}).join('')}</div></div>`;v16sync()}catch(e){view.innerHTML=`<div class="section error">${esc(e.message)}</div>`}}
async function reports(){v16nav('nReports');const view=document.getElementById('view');try{await Promise.all([loadWarehouses(),loadInspections(),loadDefects()]);const open=defectCache.filter(d=>d.status!=='Closed');view.innerHTML=`<div class="content-head"><div><h2>${v16t('Reports')}</h2><p>${v16t('Management')}</p></div></div><div class="report-cards"><div class="report-card"><h3>${v16t('WeeklyControl')}</h3><p>${open.length} ${v16t('OpenDefects').toLowerCase()}</p><button class="primary-btn" onclick="printWeeklyReport()">${v16t('Report')}</button></div><div class="report-card"><h3>${v16t('DefectRegister')}</h3><p>${open.length} ${v16t('OpenDefects').toLowerCase()}</p><button class="primary-btn" onclick="printDefectReport()">${v16t('Report')}</button></div><div class="report-card"><h3>${v16t('History')}</h3><select id="reportWarehouse">${warehouses.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select><button class="primary-btn" style="margin-top:8px" onclick="printWarehouseReport()">${v16t('Report')}</button></div></div>`;v16sync()}catch(e){view.innerHTML=`<div class="section error">${esc(e.message)}</div>`}}
